spring.application.name=ulee-backend
spring.datasource.url=jdbc:mysql://localhost:3306/ulee_db_merged
spring.datasource.username=root
spring.datasource.password=Super1010_
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.thymeleaf.cache=false
app.upload.dir=./src/main/resources/static/uploads
spring.datasource.hikari.maximum-pool-size=5
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.5-flash-lite
gemini.fallback-model=gemini-3.8-flash
gemini.thinking-level=low
gemini.search=false
swai.limit.global-per-minute=12
swai.limit.daily-requests=450
swai.limit.per-minute=6
swai.limit.per-day=15