<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password - ULEE</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f5;font-family:'Hanken Grotesk',Arial,sans-serif;color:#10302f}
.card{background:#fff;max-width:420px;width:calc(100% - 32px);padding:32px;border-radius:16px;box-shadow:0 8px 30px rgba(11,79,85,.12)}
h1{margin:0 0 12px;font-size:22px;color:#0b4f55}
p{line-height:1.5;margin:0 0 16px}
label{display:block;font-weight:600;margin:14px 0 6px}
input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #c5d6d6;border-radius:8px;font-size:15px}
.btn{display:inline-block;margin-top:18px;padding:11px 20px;background:#0b4f55;color:#fff;border:0;border-radius:8px;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer}
.err{color:#b42318;background:#fef3f2;padding:10px 12px;border-radius:8px}</style>
</head>
<body>
<main class="card">

  <div th:if="${invalid}">
    <h1>This link has expired</h1>
    <p>The reset link is invalid, already used, or has expired. Please ask for a new one.</p>
    <a class="btn" th:href="@{/student-dashboard}">Back to ULEE</a>
  </div>

  <div th:if="${done}">
    <h1>Password updated</h1>
    <p>You can now log in with your new password.</p>
    <a class="btn" th:href="@{/student-dashboard(loginRequired=true)}">Go to login</a>
  </div>

  <form th:unless="${invalid or done}" th:action="@{/reset-password}" method="post">
    <h1>Choose a new password</h1>
    <p class="err" th:if="${error != null}" th:text="${error}"></p>
    <input type="hidden" name="token" th:value="${token}" />
    <label for="password">New password</label>
    <input type="password" id="password" name="password" minlength="8" required />
    <label for="confirmPassword">Confirm password</label>
    <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" required />
    <button class="btn" type="submit">Save password</button>
  </form>

</main>
</body>
</html>
