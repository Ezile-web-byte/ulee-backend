<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews | ULEE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/landlord-style.css">
    <link rel="stylesheet" href="/landlord-reviews.css">
    <link rel="stylesheet" href="/property-list.css">
    <style>
        /* NEW — "Back" link, same look as "Back to My Properties" on the Edit Property page */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 14px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-dark);
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
        .back-link svg { width: 14px; height: 14px; }
    
        .pl-intro { position: relative; }
        .pl-search { position: absolute; top: 0; right: 0; display: flex; align-items: center; gap: 8px; width: 280px; max-width: 100%; padding: 9px 14px; border: 1.5px solid #cfe7e4; border-radius: 999px; background: #fff; color: #0f8a8a; }
        .pl-search:focus-within { border-color: #0f8a8a; box-shadow: 0 0 0 3px rgba(20,200,190,.2); }
        .pl-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14.5px; color: #12262d; }
        .pl-row.search-hidden { display: none !important; }
        .pl-no-match { display: none; padding: 22px; text-align: center; color: #5b6b6b; }
        @media (max-width: 700px) { .pl-search { position: static; width: 100%; margin-top: 12px; } }
    
        .pl-intro { display: grid !important; grid-template-columns: 1fr auto; align-items: start; column-gap: 16px; }
        .pl-intro > .pl-title, .pl-intro > .pl-sub { grid-column: 1; }
        .pl-intro > .pl-search { position: static !important; grid-column: 2; grid-row: 1 / span 2; margin: 0; }
        @media (max-width: 700px) { .pl-intro { grid-template-columns: 1fr; } .pl-intro > .pl-search { grid-column: 1; grid-row: auto; margin-top: 12px; } }
    </style>
</head>
<body>

<div class="app-shell">

    <!-- ============ SIDEBAR (shared fragment — see fragments/landlord-sidebar.html) ============ -->
    <div th:replace="~{fragments/landlord-sidebar :: sidebar('reviews')}"></div>

    <!-- ============ MAIN ============ -->
    <main class="main">


        <div th:replace="~{fragments/landlord-topbar :: topbar('Reviews')}"></div>

        <div class="page-body">

            <!-- NEW — one step back: from the All Properties reviews list to My Properties -->
            <a class="back-link" th:href="@{/landlord-index}">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Back to My Properties
            </a>

            <section class="pl-intro">
            <div class="pl-search">
                <svg viewBox="0 0 24 24" fill="none" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <input type="search" id="reviewSearch" placeholder="Search properties..." aria-label="Search properties" autocomplete="off">
            </div>
                <h2 class="pl-title">All Properties</h2>
                <p class="pl-sub">
                    <span th:text="${totalPropertiesCount}">3</span> live properties ·
                    <span th:text="${totalReviewsAll}">12</span> reviews
                </p>
            </section>

            <!-- One clickable row per property — properties with unopened reviews come first -->
            <div class="pl-card">
                <div class="pl-head" aria-hidden="true">
                    <span>Photo</span>
                    <span>Property name</span>
                    <span>Reviews</span>
                    <span></span>
                </div>

                <a class="pl-row" th:each="s : ${summaries}"
                   th:href="@{/property-reviews/{id}(id=${s.propertyID})}">

                    <div class="pl-photo">
                        <img th:if="${s.coverUrl != null}" th:src="@{${s.coverUrl}}" alt="" loading="lazy">
                        <svg th:unless="${s.coverUrl != null}" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 21V9l8-6 8 6v12h-5v-7h-6v7H4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
                    </div>

                    <p class="pl-name" th:text="${s.title}">Property Name</p>

                    <div class="pl-count">
                        <span><strong th:text="${s.totalCount}">0</strong> <span th:text="${s.totalCount == 1} ? 'review' : 'reviews'">reviews</span></span>
                        <span class="pl-new" th:if="${s.hasNew}"><span th:text="${s.unviewedCount}">2</span> new</span>
                    </div>

                    <span class="pl-chevron" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </span>
                </a>
            </div>

        </div>
    </main>
</div>

<script src="/landlord-sidebar-toggle.js" defer></script>

<script>
(function () {
  var input = document.getElementById('reviewSearch');
  var card = document.querySelector('.pl-card');
  if (!input || !card) return;
  var msg = document.createElement('div');
  msg.className = 'pl-no-match';
  msg.textContent = 'No properties match your search.';
  card.appendChild(msg);
  input.addEventListener('input', function () {
    var q = input.value.trim().toLowerCase();
    var rows = card.querySelectorAll('.pl-row');
    var shown = 0;
    rows.forEach(function (row) {
      var n = row.querySelector('.pl-name');
      var ok = !q || (n && n.textContent.toLowerCase().indexOf(q) !== -1);
      row.classList.toggle('search-hidden', !ok);
      if (ok) shown++;
    });
    msg.style.display = (q && rows.length && shown === 0) ? 'block' : 'none';
  });
})();
</script>
</body>
</html>
