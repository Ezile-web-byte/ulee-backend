<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULEE | Reviews</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/landlord-style.css">
    <link rel="stylesheet" href="/landlord-reviews.css">
    <link rel="stylesheet" href="/speak-with-ai.css">
    <script src="/speak-with-ai-logic.js" defer></script>
    <script src="/speak-with-ai.js" defer></script>
</head>
<body>

<div class="app-shell">

    <aside class="sidebar">
        <div class="brand">
            <span class="brand-name">ULEE</span>
            <span class="brand-sub">The Future of Student Living</span>
        </div>

        <nav class="nav-list">
            <a th:href="@{/landlord-index}" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>
                <span>My Properties</span>
            </a>
            <a th:href="@{/manage-applications}" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M8 3h8a2 2 0 0 1 2 2v14l-6-3-6 3V5a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
                <span>Applications</span>
            </a>
            <a th:href="@{/my-property-reviews}" class="nav-item active">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M12 3.5 14.4 9l6 .6-4.5 4 1.4 5.9L12 16.6 6.7 19.5l1.4-5.9-4.5-4 6-.6L12 3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
                <span>Reviews</span>
            </a>
        </nav>
    </aside>

    <main class="main">

        <header class="topbar">
            <h1 class="topbar-title">Reviews</h1>
            <img class="avatar" src="/static/uploads/landlord-avatar.jpg" alt="Landlord profile photo">
        </header>

        <div class="page-body">

            <div class="page-head">
                <div>
                    <h2 class="page-title">Property Reviews</h2>
                    <p class="page-subtitle">See what students are saying about each of your properties.</p>
                </div>
            </div>

            <div th:each="property : ${properties}" class="review-group">

                <div class="review-group-header">
                    <h3 class="review-group-title" th:text="${property.title}">The Admiralty</h3>
                </div>

                <div class="review-list"
                     th:with="propertyReviews=${reviewsByProperty.get(property.propertyID)}"
                     th:if="${propertyReviews != null and !propertyReviews.isEmpty()}">
                    <div th:each="review : ${propertyReviews}"
                         th:replace="~{fragments/review-card :: reviewCard(${review})}"></div>
                </div>

                <p class="review-empty"
                   th:with="propertyReviews=${reviewsByProperty.get(property.propertyID)}"
                   th:if="${propertyReviews == null or propertyReviews.isEmpty()}">
                    No reviews yet for this property.
                </p>
            </div>

            <div th:if="${#lists.isEmpty(properties)}" class="reviews-empty-state">
                <h3>No properties yet</h3>
                <p>Once you list a property, its reviews will show up here.</p>
            </div>

        </div>
    </main>
</div>

<script src="/landlord-script.js"></script>

<div th:replace="~{fragments/speak-with-ai :: speakWithAiWidget(null, null)}"></div>

</body>
</html>
