<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>List a New Property – ULEE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" th:href="@{/landlord-style.css}" href="/landlord-style.css" />
  <link rel="stylesheet" th:href="@{/listProperty.css}" href="/listProperty.css" />
</head>
<body>

<header class="topbar">
  <h1 class="topbar-title">List a New Property</h1>
  <div style="display: flex; align-items: center; gap: 16px;">
    <a th:href="@{/landlord-index}" href="/landlord-index" class="btn btn-secondary" style="display: inline-flex; align-items: center; text-decoration: none; font-size: 0.9rem; padding: 6px 14px;">
      ← Back
    </a>
    <div class="avatar-initials" th:text="${userInitials != null ? userInitials : 'EH'}">EH</div>
  </div>
</header>

<main class="container" style="padding-top: 2rem;">
  <!-- Clean Back Link -->
  <div class="head-title">
    <h1>List a New Property</h1>
    <p>Follow the steps below to publish your student accommodation listing.</p>
  </div>

  <!-- Step Tracker -->
  <div class="tracker-card">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="steps-row" id="stepsTracker"></div>
  </div>

  <!-- Wizard Form -->
  <form id="listPropertyForm" class="wizard-card" th:action="@{/listProperty}" method="post" enctype="multipart/form-data">

    <div class="panel-content" id="stepPanel">
      <!-- Rendered by JS -->
    </div>

    <div class="actions-bar">
      <button type="button" class="btn btn-secondary" id="prevBtn" onclick="navigateStep(-1)">← Back</button>
      <div class="btn-group-right">
        <button type="submit" class="btn btn-outline" id="draftBtn" onclick="setSubmitAction('draft')">Save Draft</button>
        <button type="button" class="btn btn-primary" id="nextBtn" onclick="navigateStep(1)">Continue →</button>
      </div>
    </div>

    <input type="hidden" name="action" id="formAction" value="submit" />
  </form>

  <!-- Special-features prompt, shown after the Photos step. Kept outside
       the <form> and using plain type="button"s so it can never itself
       trigger a submit. -->
  <div id="specialFeatureModal" class="modal-overlay">
    <div class="modal-box">
      <h3>Any special features?</h3>
      <p>Things like a Braai Area, Study Hub, or Game Room that make this place stand out.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeSpecialModal(false)">No, skip to Review</button>
        <button type="button" class="btn btn-primary" onclick="closeSpecialModal(true)">Yes, add features</button>
      </div>
    </div>
  </div>
</main>

<style>
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    align-items: center;
    justify-content: center;
    z-index: 2000;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 12px;
    padding: 28px;
    max-width: 380px;
    width: 90%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  /*<!--making the header stick at the top -->*/
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .modal-box h3 { margin: 0 0 8px; font-size: 1.15rem; }
  .modal-box p { margin: 0 0 20px; color: #666; font-size: 0.9rem; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
</style>

<!--
  Passes the real amenity list (grouped by category) from the controller's
  model straight into the wizard's JS as JSON. This is what lets the
  Amenities step render your actual database rows instead of a hardcoded
  placeholder list, and keeps the two permanently in sync.
-->
<script th:inline="javascript">
  /*<![CDATA[*/
  window.AMENITY_CATEGORIES = /*[[${amenityCategories}]]*/ {};
  /*]]>*/
</script>
<script th:src="@{/listProperty.js}" src="/listProperty.js"></script>
</body>
</html>
