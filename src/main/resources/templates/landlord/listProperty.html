<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>List a New Property – ULEE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/landlord-style.css}" href="/landlord-style.css" />
  <link rel="stylesheet" th:href="@{/listProperty.css}" href="/listProperty.css" />

  <style>
    /* Header layout for this page: cancel (X) + title on the left,
       bell + avatar side by side on the right. */
    .topbar-left { display: flex; align-items: center; gap: 14px; }
    .topbar-actions { display: flex; align-items: center; gap: 14px; }
    .topbar-cancel {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #f1f5f5;
      color: var(--primary-dark, #0b4f55);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .topbar-cancel:hover { background: #e2eded; }
  </style>
</head>
<body>

<!-- Own header on this page (instead of the shared topbar fragment) because it
     needs the cancel (X) button on the left. The popup script at the bottom
     looks for the element with id="cancelListing". -->
<header class="topbar">
  <div class="topbar-left">
    <a id="cancelListing" class="topbar-cancel" th:href="@{/landlord-index}" aria-label="Cancel listing" title="Cancel listing">✕</a>
    <h1 class="topbar-title">List a Property</h1>
  </div>
  <div class="topbar-actions">
    <div th:replace="~{fragments/landlord-notifications :: bell}"></div>
    <div class="avatar-initials" th:text="${landlordInitials != null ? landlordInitials : '?'}">?</div>
  </div>
</header>


<main class="container-split">

  <!-- ══════════ LEFT: the wizard ══════════ -->
  <div class="wizard-column">

    <div class="tracker-card">
      <div class="tracker-head">
        <p class="tracker-caption">
          <span class="tracker-step-count" id="stepCount">Step 1 of 6</span>
          <span class="tracker-step-name" id="stepName">Basic info</span>
        </p>
        <span class="tracker-saved" id="saveIndicator">Saved</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="steps-row" id="stepsTracker"></div>
    </div>

    <form id="listPropertyForm" class="wizard-card" th:action="@{/listProperty}" method="post" enctype="multipart/form-data">

      <div class="panel-content" id="stepPanel">
        <!-- Rendered by JS -->
      </div>

      <div class="actions-bar">
        <button type="button" class="btn btn-secondary" id="prevBtn" onclick="navigateStep(-1)">Back</button>
        <div class="btn-group-right">
          <button type="submit" formnovalidate class="btn btn-outline" id="draftBtn" onclick="setSubmitAction('draft')">Save draft</button>
          <button type="button" class="btn btn-primary" id="nextBtn" onclick="navigateStep(1)">Continue</button>
        </div>
      </div>

      <input type="hidden" name="action" id="formAction" value="submit" />
    </form>

  </div>

  <!-- ══════════ RIGHT: what students will actually see ══════════ -->
  <aside class="preview-column">

    <div class="preview-card" id="previewCard">
      <p class="preview-eyebrow">How students will see this</p>

      <div class="listing-card">
        <div class="listing-media" id="previewMedia">
          <div class="listing-media-empty" id="previewMediaEmpty">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>
            <span>Cover photo comes in at step 5</span>
          </div>
          <img id="previewImage" alt="" />
          <span class="listing-status">Draft</span>
        </div>

        <div class="listing-body">
          <h3 class="listing-title" id="previewTitle">Untitled listing</h3>
          <p class="listing-location" id="previewLocation">Address not set</p>
          <div class="listing-badges" id="previewBadges"></div>
          <div class="listing-foot">
            <span class="listing-rent" id="previewRent">R— / month</span>
            <span class="listing-type" id="previewType">Room type</span>
          </div>
        </div>
      </div>
    </div>

    <div class="readiness" id="readiness">
      <p class="readiness-head">
        <span id="readinessTitle">Needed to publish</span>
        <span class="readiness-count" id="readinessCount">0 of 4</span>
      </p>
      <ul class="readiness-list" id="readinessList"></ul>
      <p class="readiness-note" id="readinessNote">
        Anything still missing saves as a draft instead of going live.
      </p>
    </div>

  </aside>

</main>

<script th:inline="javascript">
  /*<![CDATA[*/
  window.AMENITY_CATEGORIES = /*[[${amenityCategories}]]*/ {};
  window.AVAILABLE_FROM_OPTIONS = /*[[${availableFromOptions}]]*/ [];
  /*]]>*/
</script>

<!-- Shared popup (css + js + post-redirect popup). Must come BEFORE listProperty.js. -->
<th:block th:replace="~{fragments/modal :: assets}"></th:block>

<script th:src="@{/listProperty.js}" src="/listProperty.js"></script>

<script>
  /* Popups for this page. Capture phase on the document, so these run
     BEFORE the inline onclick handlers on the buttons. */

  /* 1. Continue: block the step if anything in the current step is invalid */
  document.addEventListener('click', async function (e) {
    if (!e.target.closest('#nextBtn')) return;
    var problems = UleeModal.collectProblems(document.getElementById('stepPanel'));
    if (!problems.length) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    await UleeModal.alert({
      tone: 'warn',
      title: 'A few things need fixing',
      message: 'Please sort these out before continuing:',
      list: problems,
      okText: 'Got it'
    });
  }, true);

  /* 2. X (top left): cancel the listing or keep it as a draft */
  document.addEventListener('click', async function (e) {
    var link = e.target.closest('#cancelListing');
    if (!link) return;
    e.preventDefault();
    var pick = await UleeModal.choice({
      icon: '❓',
      title: 'Cancel this listing?',
      message: 'Save your progress as a draft to finish later, or discard everything you entered.',
      buttons: [
        { label: 'Keep editing', value: 'stay', style: 'ghost' },
        { label: 'Discard', value: 'discard', style: 'danger' },
        { label: 'Save as draft', value: 'draft', style: 'primary' }
      ]
    });
    if (pick === 'draft') document.getElementById('draftBtn').click();
    if (pick === 'discard') window.location.href = link.href;
  }, true);
</script>
</body>
</html>
