<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Speak with AI — reusable floating chat widget.

  Usage (Property_Detail_Page — Property_Context):
    Build a plain comma-joined features string first (amenities + special
    features), then pass it along with the property's own fields:

    <div th:with="propertyFeatures=${
             (amenities != null and !amenities.isEmpty() ? #strings.listJoin(amenities.![name], ', ') : '')
             + (features != null and !features.isEmpty()
                 ? ((amenities != null and !amenities.isEmpty()) ? ', ' : '') + #strings.listJoin(features.![name], ', ')
                 : '')
         }"
         th:replace="~{fragments/speak-with-ai :: speakWithAiWidget(
             ${property.propertyID}, ${property.title},
             ${property.address + ', ' + property.city}, ${property.commuteType},
             ${propertyFeatures})}">
    </div>

  Usage (any other page — General_Context):
    <div th:replace="~{fragments/speak-with-ai :: speakWithAiWidget(null, null, null, null, null)}"></div>

  Requires (link once per page, alongside this include):
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/speak-with-ai.css">
    <script src="/speak-with-ai-logic.js" defer></script>
    <script src="/speak-with-ai.js" defer></script>

  REDESIGN: ULEE navy/teal header (logo mark, online dot, animated wave).
  All element IDs and Thymeleaf parameters are unchanged, so
  speak-with-ai.js needs no edits.
-->
<div th:fragment="speakWithAiWidget(propertyId, propertyTitle, propertyAddress, propertyCommuteType, propertyFeatures)"
     class="swai-root"
     id="swai-root"
     th:attr="data-property-id=${propertyId},data-property-title=${propertyTitle},data-property-address=${propertyAddress},data-property-commute-type=${propertyCommuteType},data-property-features=${propertyFeatures}">

    <!-- Hello bubble: always visible next to the chat icon while the chat is closed -->
    <div id="swai-teaser" class="swai-teaser" role="status" hidden>
        <div class="swai-teaser-avatar" aria-hidden="true">
            <svg viewBox="0 0 20 20"><path d="M10 2L3 7v11h14V7L10 2zm0 2.6 5 3.5V16H5V8.1l5-3.5zM8 10h4v6H8z"/></svg>
        </div>
        <div class="swai-teaser-msg">
            <div class="swai-teaser-name">ULEE &middot; AI assistant</div>
            <div class="swai-teaser-typing" aria-hidden="true"><i></i><i></i><i></i></div>
            <p class="swai-teaser-text">Hey, I&rsquo;m ULEE, your AI assistant &#128075;</p>
        </div>
        <button type="button" id="swai-teaser-close" class="swai-teaser-close" aria-label="Dismiss message">&times;</button>
    </div>

    <button type="button" id="swai-icon" class="swai-icon" aria-label="Open ULEE AI assistant" aria-expanded="false">
        <!-- single chat-bubble icon -->
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
    </button>

    <section id="swai-panel" class="swai-panel" hidden aria-hidden="true" role="dialog" aria-label="Chat assistant">
        <header class="swai-panel-header">
            <div class="swai-avatar" aria-hidden="true">
                <svg viewBox="0 0 20 20"><path d="M10 2L3 7v11h14V7L10 2zm0 2.6 5 3.5V16H5V8.1l5-3.5zM8 10h4v6H8z"/></svg>
            </div>
            <div class="swai-who">
                <span class="swai-title" id="swai-title">Assistant</span>
                <span class="swai-status"><i class="swai-dot"></i>ULEE AI assistant &middot; Online</span>
            </div>
            <button type="button" id="swai-close" class="swai-close" aria-label="Close chat">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg>
            </button>
            <svg class="swai-wave" viewBox="0 0 1200 40" preserveAspectRatio="none" aria-hidden="true">
                <path class="w-back"  d="M0 18 q75 -16 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 V40 H0 Z"/>
                <path class="w-front" d="M0 26 q75 -14 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 V40 H0 Z"/>
            </svg>
        </header>

        <div id="swai-history" class="swai-history" aria-live="polite"></div>

        <form id="swai-form" class="swai-form">
            <input id="swai-input" class="swai-input" type="text" autocomplete="off"
                   placeholder="Type a message…" aria-label="Message input" />
            <button type="submit" class="swai-send" aria-label="Send message">Send</button>
        </form>
    </section>
</div>
</body>
</html>
