<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Shared student sidebar + logout confirmation, in the ULEE navy/teal look.
  Used by the My Stay pages. Place at: templates/fragments/student-sidebar.html

  Usage (as a direct child of <div class="app-shell">):
    <div th:replace="~{fragments/student-sidebar :: sidebar('my-stay')}"></div>

  `active` is one of: 'dashboard' | 'applications' | 'my-stay' | 'saved' | 'browse'

  Badge counts come from the model and are null-safe, so a page that does not
  set them simply shows no badge: totalApplications, acceptedCount, savedCount.

  The fragment root is a th:block so the sidebar AND the logout modal both come
  through th:replace (anything outside the fragment root would be dropped).

  LOGOUT POPUP: now uses the same ULEE design-system popup as the admin sidebar
  (white card, pale teal icon circle, solid teal confirm button), with a
  student-focused message. Its styles live in this fragment (ulee-logout-*),
  so no changes to the page stylesheet are needed.
-->
<th:block th:fragment="sidebar(active)">

    <aside class="sidebar" id="sidebar" aria-label="Student navigation">
        <a class="logo" th:href="@{/student-dashboard}" aria-label="ULEE home">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2L3 7v11h14V7L10 2zm0 2.6 5 3.5V16H5V8.1l5-3.5zM8 10h4v6H8z"/></svg>
            <div>
                <div class="logo-name">ULEE</div>
                <div class="logo-tag">Student Living. Simplified.</div>
            </div>
        </a>

        <div class="nav-label">Student portal</div>
        <nav class="nav-list">
            <a class="nav-item" th:classappend="${active == 'dashboard'} ? ' active'"
               th:attr="aria-current=${active == 'dashboard' ? 'page' : null}" th:href="@{/my-dashboard}">
                <span class="material-symbols-outlined" aria-hidden="true">space_dashboard</span><span>My Dashboard</span>
            </a>
            <a class="nav-item" th:classappend="${active == 'applications'} ? ' active'"
               th:attr="aria-current=${active == 'applications' ? 'page' : null}" th:href="@{/my-applications}">
                <span class="material-symbols-outlined" aria-hidden="true">description</span><span>My Applications</span>
                <span class="nav-badge" th:if="${totalApplications != null and totalApplications > 0}" th:text="${totalApplications}">0</span>
            </a>
            <a class="nav-item" th:classappend="${active == 'my-stay'} ? ' active'"
               th:attr="aria-current=${active == 'my-stay' ? 'page' : null}" th:href="@{/my-stay}">
                <span class="material-symbols-outlined" aria-hidden="true">rate_review</span><span>My Stay</span>
                <span class="nav-badge" th:if="${acceptedCount != null and acceptedCount > 0}" th:text="${acceptedCount}">0</span>
            </a>
            <a class="nav-item" th:classappend="${active == 'saved'} ? ' active'"
               th:attr="aria-current=${active == 'saved' ? 'page' : null}" th:href="@{/saved-properties}">
                <span class="material-symbols-outlined" aria-hidden="true">favorite</span><span>Saved Properties</span>
                <span class="nav-badge" th:if="${savedCount != null and savedCount > 0}" th:text="${savedCount}">0</span>
            </a>
            <a class="nav-item" th:classappend="${active == 'browse'} ? ' active'"
               th:attr="aria-current=${active == 'browse' ? 'page' : null}" th:href="@{/student-dashboard}">
                <span class="material-symbols-outlined" aria-hidden="true">travel_explore</span><span>Browse Properties</span>
            </a>
        </nav>

        <div class="sidebar-foot">
            <form id="logoutForm" th:action="@{/logout}" method="post">
                <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="button" class="nav-item logout" id="openLogout">
                    <span class="material-symbols-outlined" aria-hidden="true">logout</span><span>Log out</span>
                </button>
            </form>
        </div>
    </aside>

    <!-- Logout confirmation (same popup as the admin side; POSTs the real /logout form only on confirm) -->
    <div class="ulee-logout-overlay" id="uleeLogoutOverlay" aria-hidden="true">
        <div class="ulee-logout-modal" role="alertdialog" aria-modal="true" aria-labelledby="uleeLogoutTitle">
            <div class="ulee-logout-icon">
                <svg viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>
            </div>
            <h3 id="uleeLogoutTitle" class="ulee-logout-title">Log out?</h3>
            <p class="ulee-logout-text">You’ll need to log in again to see your applications, saved rooms and stay details.</p>
            <div class="ulee-logout-actions">
                <button type="button" id="uleeLogoutCancelBtn" class="ulee-logout-btn ulee-logout-cancel">Cancel</button>
                <button type="button" id="uleeLogoutConfirmBtn" class="ulee-logout-btn ulee-logout-confirm">Log out</button>
            </div>
        </div>
    </div>

    <style>
        /* ── Logout popup: ULEE design-system colours (matches the admin popup) ── */
        .ulee-logout-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 30, 38, 0.45);
            backdrop-filter: blur(3px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
            opacity: 0;
            transition: opacity .18s ease;
        }
        .ulee-logout-overlay.active {
            display: flex;
            opacity: 1;
        }
        .ulee-logout-modal {
            background: #ffffff;
            border-radius: 18px;
            padding: 28px 26px 22px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0,0,0,0.25);
            transform: translateY(14px) scale(.97);
            transition: transform .18s ease;
            font-family: 'Hanken Grotesk', sans-serif;
        }
        .ulee-logout-overlay.active .ulee-logout-modal {
            transform: translateY(0) scale(1);
        }
        .ulee-logout-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: #E3F6F3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ulee-logout-icon svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: #006A6A;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .ulee-logout-title {
            margin: 0 0 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 19px;
            font-weight: 700;
            color: #12262d;
        }
        .ulee-logout-text {
            margin: 0 0 22px;
            font-size: 13.5px;
            line-height: 1.6;
            color: #5b6b71;
        }
        .ulee-logout-actions {
            display: flex;
            gap: 10px;
        }
        .ulee-logout-btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform .1s ease, filter .15s ease;
        }
        .ulee-logout-btn:hover { filter: brightness(0.96); }
        .ulee-logout-btn:active { transform: scale(0.97); }
        .ulee-logout-btn:focus-visible { outline: 2px solid #14C8BE; outline-offset: 3px; }
        .ulee-logout-cancel {
            background: #ffffff;
            border: 1px solid #d9dfe2;
            color: #444;
        }
        .ulee-logout-confirm {
            background: #006A6A;
            border: 1px solid #006A6A;
            color: #fff;
        }
    </style>

    <script>
        (function () {
            var overlay = document.getElementById('uleeLogoutOverlay');
            var openBtn = document.getElementById('openLogout');
            if (!overlay || !openBtn) return;

            function open() {
                overlay.setAttribute('aria-hidden', 'false');
                overlay.classList.add('active');
                document.getElementById('uleeLogoutCancelBtn').focus();
            }
            function close() {
                overlay.classList.remove('active');
                overlay.setAttribute('aria-hidden', 'true');
                openBtn.focus();
            }

            openBtn.addEventListener('click', open);
            document.getElementById('uleeLogoutCancelBtn').addEventListener('click', close);
            document.getElementById('uleeLogoutConfirmBtn').addEventListener('click', function () {
                document.getElementById('logoutForm').submit();
            });
            overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && overlay.classList.contains('active')) close();
            });
        })();
    </script>

</th:block>

</body>
</html>
