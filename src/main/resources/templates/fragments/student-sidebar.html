<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Shared student sidebar + logout confirmation, in the ULEE navy/teal look.
  Single source of truth for EVERY student page (My Dashboard, My Applications,
  My Stay, Saved/Favourite Properties). Place at: templates/fragments/student-sidebar.html

  Usage (as a direct child of <div class="app-shell">):
    <div th:replace="~{fragments/student-sidebar :: sidebar('dashboard')}"></div>

  `active` is one of: 'dashboard' | 'applications' | 'my-stay' | 'saved' | 'browse'

  Badge counts come from the model and are null-safe, so a page that does not
  set them simply shows no badge: totalApplications, acceptedCount, savedCount.

  SELF-CONTAINED: the sidebar styles (ulee-sb rules below), the collapse toggle
  and the logout popup all live in this fragment, so the sidebar looks and
  behaves identically on every page regardless of that page's own CSS.
  Pages must NOT keep their own inline <aside class="sidebar">, logout modal or
  logout script, and must not load landlord-sidebar-toggle.js themselves
  (this fragment loads it once).
-->
<th:block th:fragment="sidebar(active)">

    <aside class="sidebar" id="sidebar" aria-label="Student navigation">
        <div class="logo">
            <a class="logo-mark" th:href="@{/student-dashboard}" aria-label="ULEE home">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2L3 7v11h14V7L10 2zm0 2.6 5 3.5V16H5V8.1l5-3.5zM8 10h4v6H8z"/></svg>
                <div class="logo-text">
                    <div class="logo-name">ULEE</div>
                    <div class="logo-tag">Student Living. Simplified.</div>
                </div>
            </a>
            <button class="sidebar-toggle" id="sidebar-toggle" type="button" title="Toggle sidebar" aria-label="Toggle sidebar" aria-expanded="true">
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>

        <div class="nav-label">Student portal</div>
        <nav class="nav-list">
            <a class="nav-item" th:classappend="${active == 'dashboard'} ? ' active'"
               th:attr="aria-current=${active == 'dashboard' ? 'page' : null}" th:href="@{/my-dashboard}">
                <span class="material-symbols-outlined" aria-hidden="true">space_dashboard</span><span>My Dashboard</span>
            </a>
            <a class="nav-item" th:classappend="${active == 'applications'} ? ' active'"
               th:attr="aria-current=${active == 'applications' ? 'page' : null}" th:href="@{/my-applications}">
                <span class="material-symbols-outlined" aria-hidden="true">description</span><span>My Applications</span>
                <span class="nav-badge" th:if="${totalApplications != null and totalApplications > 0}" th:text="${totalApplications}">0</span>
            </a>
            <a class="nav-item" th:classappend="${active == 'my-stay'} ? ' active'"
               th:attr="aria-current=${active == 'my-stay' ? 'page' : null}" th:href="@{/my-stay}">
                <span class="material-symbols-outlined" aria-hidden="true">rate_review</span><span>My Stay</span>
                <span class="nav-badge" th:if="${acceptedCount != null and acceptedCount > 0}" th:text="${acceptedCount}">0</span>
            </a>
            <a class="nav-item" th:classappend="${active == 'saved'} ? ' active'"
               th:attr="aria-current=${active == 'saved' ? 'page' : null}" th:href="@{/saved-properties}">
                <span class="material-symbols-outlined" aria-hidden="true">favorite</span><span>Favourite Properties</span>
                <span class="nav-badge" th:if="${savedCount != null and savedCount > 0}" th:text="${savedCount}">0</span>
            </a>
            <a class="nav-item" th:classappend="${active == 'browse'} ? ' active'"
               th:attr="aria-current=${active == 'browse' ? 'page' : null}" th:href="@{/student-dashboard}">
                <span class="material-symbols-outlined" aria-hidden="true">travel_explore</span><span>Browse Properties</span>
            </a>
        </nav>

        <div class="sidebar-foot">
            <form id="logoutForm" th:action="@{/logout}" method="post">
                <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="button" class="nav-item logout" id="openLogout">
                    <span class="material-symbols-outlined" aria-hidden="true">logout</span><span>Log out</span>
                </button>
            </form>
        </div>
    </aside>

    <!-- Logout confirmation (POSTs the real /logout form only on confirm) -->
    <div class="ulee-logout-overlay" id="uleeLogoutOverlay" aria-hidden="true">
        <div class="ulee-logout-modal" role="alertdialog" aria-modal="true" aria-labelledby="uleeLogoutTitle">
            <div class="ulee-logout-icon">
                <svg viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>
            </div>
            <h3 id="uleeLogoutTitle" class="ulee-logout-title">Log out?</h3>
            <p class="ulee-logout-text">You’ll need to log in again to see your applications, saved rooms and stay details.</p>
            <div class="ulee-logout-actions">
                <button type="button" id="uleeLogoutCancelBtn" class="ulee-logout-btn ulee-logout-cancel">Cancel</button>
                <button type="button" id="uleeLogoutConfirmBtn" class="ulee-logout-btn ulee-logout-confirm">Log out</button>
            </div>
        </div>
    </div>

    <style>
        /* ── Sidebar: identical on every student page ── */
        .app-shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; transition: grid-template-columns .25s ease; }
        .sidebar {
            background: #071C2D; border-right: 1px solid #007178;
            display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0;
            overflow-y: auto; padding: 0 20px 24px; box-sizing: border-box;
        }
        .sidebar *, .sidebar *::before, .sidebar *::after { box-sizing: border-box; }
        .sidebar .logo { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 26px 0 28px; text-decoration: none; }
        .sidebar .logo-mark { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
        .sidebar .logo-mark svg { width: 30px; height: 30px; fill: #14C8BE; filter: drop-shadow(0 0 6px rgba(20,200,190,.5)); display: block; flex-shrink: 0; }
        .sidebar .logo-text { min-width: 0; overflow: hidden; white-space: nowrap; }
        .sidebar .logo-name { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 22px; line-height: 1; color: #14C8BE; }
        .sidebar .logo-tag { font-size: 10.5px; font-weight: 600; color: #14C8BE; opacity: .85; margin-top: 3px; }
        .sidebar .sidebar-toggle { flex-shrink: 0; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: #B7C3CB; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s ease, color .15s ease; }
        .sidebar .sidebar-toggle:hover { background: rgba(255,255,255,.08); color: #fff; }
        .sidebar .sidebar-toggle svg { width: 16px; height: 16px; transition: transform .25s ease; }
        .sidebar .nav-label { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(183,195,203,.55); margin: 8px 0 8px 16px; }
        .sidebar .nav-list { display: flex; flex-direction: column; gap: 4px; }
        .sidebar .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px;
            font: 600 14px 'Hanken Grotesk', sans-serif; color: #B7C3CB; text-decoration: none;
            background: none; border: 0; width: 100%; cursor: pointer; text-align: left;
            transition: background .2s ease, color .2s ease;
        }
        .sidebar .nav-item .material-symbols-outlined { font-size: 20px; }
        .sidebar .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
        .sidebar .nav-item:focus-visible { outline: 2px solid #14C8BE; outline-offset: 2px; }
        .sidebar .nav-item.active {
            background: #007178; color: #fff;
            margin: 0 -20px; width: calc(100% + 40px); padding: 12px 36px; border-radius: 0;
            box-shadow: inset 3px 0 0 #14C8BE;
        }
        .sidebar .nav-badge {
            margin-left: auto; background: #01A49F; color: #fff; font-size: 11px; font-weight: 700;
            min-width: 20px; height: 20px; padding: 0 6px; border-radius: 9999px;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .sidebar .sidebar-foot { margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.08); }
        .sidebar .nav-item.logout { color: #ff9b91; }
        .sidebar .nav-item.logout:hover { background: rgba(255,138,128,.08); color: #ffb4ab; }

        @media (min-width: 861px) {
            .app-shell.sidebar-collapsed { grid-template-columns: 76px 1fr; }
            .sidebar.collapsed { padding-left: 14px; padding-right: 14px; }
            .sidebar.collapsed .logo { justify-content: center; }
            .sidebar.collapsed .logo-mark { display: none; }
            .sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
            .sidebar.collapsed .nav-label { display: none; }
            .sidebar.collapsed .nav-item { justify-content: center; padding-left: 0; padding-right: 0; gap: 0; }
            .sidebar.collapsed .nav-item > span:not(.material-symbols-outlined) { display: none; }
            .sidebar.collapsed .nav-item.active { margin-left: -14px; margin-right: -14px; width: calc(100% + 28px); }
        }
        @media (max-width: 860px) {
            .app-shell { grid-template-columns: 1fr; }
            .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 16px 12px; }
            .sidebar .logo { padding: 16px 0 8px; width: 100%; }
            .sidebar .sidebar-toggle { display: none; }
            .sidebar .nav-label, .sidebar .sidebar-foot { display: none; }
            .sidebar .nav-list { flex-direction: row; flex-wrap: wrap; }
            .sidebar .nav-item, .sidebar .nav-item.active { width: auto; margin: 0; padding: 9px 12px; border-radius: 10px; }
        }

        /* ── Logout popup: ULEE design-system colours (matches the admin popup) ── */
        .ulee-logout-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 30, 38, 0.45);
            backdrop-filter: blur(3px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
            opacity: 0;
            transition: opacity .18s ease;
        }
        .ulee-logout-overlay.active {
            display: flex;
            opacity: 1;
        }
        .ulee-logout-modal {
            background: #ffffff;
            border-radius: 18px;
            padding: 28px 26px 22px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0,0,0,0.25);
            transform: translateY(14px) scale(.97);
            transition: transform .18s ease;
            font-family: 'Hanken Grotesk', sans-serif;
        }
        .ulee-logout-overlay.active .ulee-logout-modal {
            transform: translateY(0) scale(1);
        }
        .ulee-logout-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: #E3F6F3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ulee-logout-icon svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: #006A6A;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .ulee-logout-title {
            margin: 0 0 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 19px;
            font-weight: 700;
            color: #12262d;
        }
        .ulee-logout-text {
            margin: 0 0 22px;
            font-size: 13.5px;
            line-height: 1.6;
            color: #5b6b71;
        }
        .ulee-logout-actions {
            display: flex;
            gap: 10px;
        }
        .ulee-logout-btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform .1s ease, filter .15s ease;
        }
        .ulee-logout-btn:hover { filter: brightness(0.96); }
        .ulee-logout-btn:active { transform: scale(0.97); }
        .ulee-logout-btn:focus-visible { outline: 2px solid #14C8BE; outline-offset: 3px; }
        .ulee-logout-cancel {
            background: #ffffff;
            border: 1px solid #d9dfe2;
            color: #444;
        }
        .ulee-logout-confirm {
            background: #006A6A;
            border: 1px solid #006A6A;
            color: #fff;
        }
    </style>

    <script>
        (function () {
            // Collapse/expand behaviour: load the shared script once, unless the page already has it.
            if (!document.querySelector('script[src*="landlord-sidebar-toggle"]')) {
                var s = document.createElement('script');
                s.src = '/landlord-sidebar-toggle.js';
                s.defer = true;
                document.head.appendChild(s);
            }

            var overlay = document.getElementById('uleeLogoutOverlay');
            var openBtn = document.getElementById('openLogout');
            if (!overlay || !openBtn) return;

            function open() {
                overlay.setAttribute('aria-hidden', 'false');
                overlay.classList.add('active');
                document.getElementById('uleeLogoutCancelBtn').focus();
            }
            function close() {
                overlay.classList.remove('active');
                overlay.setAttribute('aria-hidden', 'true');
                openBtn.focus();
            }

            openBtn.addEventListener('click', open);
            document.getElementById('uleeLogoutCancelBtn').addEventListener('click', close);
            document.getElementById('uleeLogoutConfirmBtn').addEventListener('click', function () {
                document.getElementById('logoutForm').submit();
            });
            overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && overlay.classList.contains('active')) close();
            });
        })();
    </script>

</th:block>

</body>
</html>
