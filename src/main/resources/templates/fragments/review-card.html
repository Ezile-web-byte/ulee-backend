<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="reviewCard(review)" class="review-card"
     th:classappend="${review.isReported} ? 'review-card--reported'">

    <span class="review-reported-badge" th:if="${review.isReported}">Reported</span>

    <div class="review-card-header">
        <div class="review-avatar" th:text="${review.initials}">SM</div>

        <div class="review-identity">
            <div class="review-name" th:text="${review.reviewerName}">Sarah M.</div>
            <div class="review-role" th:text="${review.reviewerRole}">Resident • 2nd Year Student</div>
        </div>

        <div class="review-rating-date">
        <span class="review-stars"
              th:text="${'★'.repeat(review.rating)} + ${'☆'.repeat(5 - review.rating)}">★★★★★</span>
            <span class="review-date"
                  th:text="${#temporals.format(review.reviewDate, 'MMM d, yyyy')}">Oct 12, 2023</span>
        </div>
    </div>

    <p class="review-comment" th:text="${review.comment}">
        Great place to stay, very close to campus.
    </p>

    <div class="review-response" th:if="${review.landlordResponse != null and !review.landlordResponse.isEmpty()}">
        <p class="review-response-label">Landlord Reply</p>
        <p class="review-response-text" th:text="${review.landlordResponse}">Thanks for staying with us!</p>
    </div>

    <div class="review-card-footer">
        <span class="review-helpful">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M7 22h2a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2H7v12ZM7 10 10.5 3a1.5 1.5 0 0 1 3 1.5V9h5.2a2 2 0 0 1 1.98 2.3l-1.1 7.4a2 2 0 0 1-1.98 1.7H7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            Helpful
        </span>

        <form th:if="${review.isReported}" th:action="@{/resolve-review/{id}(id=${review.reviewID})}" method="post" class="inline-form">
            <button type="submit" class="review-resolve-btn">Mark Resolved</button>
        </form>
        <svg th:unless="${review.isReported}" class="review-flag" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 21V4h13l-3 5 3 5H5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>
</div>

</body>
</html>
