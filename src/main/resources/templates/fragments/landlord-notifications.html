<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Landlord notification bell. This is where official warnings show up
  (issue #4/#6) — "Dear [Landlord], this serves as an official warning…"
  with the complaints attached and the complainer's identity left out.

  HOW TO USE:
  Paste this one line wherever your topbar/header currently is on the
  landlord dashboard (and any other landlord page you want the bell on):

    <div th:replace="~{fragments/landlord-notifications :: bell}"></div>

  That's it — no controller changes needed. It talks to
  NotificationController (/landlord/notifications) on its own using the
  logged-in session, so it works on any landlord page without that page's
  controller adding anything to the Model.

  FIX #1: this used to reuse the .icon-btn / .notif-wrap / .notif-dot class
  names to match the admin-side bell — but those classes were only ever
  defined in the admin stylesheet, never in landlord-style.css. On the
  landlord dashboard that meant the button rendered as a bare, unstyled
  <button> (a plain square with no visible icon). Fixed by giving this
  fragment its own scoped <style> block instead of depending on classes
  that may not exist.

  FIX #2: the <script> block that wires up clicks and calls
  loadNotifications() was sitting as a SIBLING after this fragment's
  closing </div>, instead of nested inside it — the exact bug
  notification-bell.html's own comment warns about. th:fragment only pulls
  in the element it's attached to (plus everything nested inside that
  element); anything after it in the same file gets left behind entirely
  when referenced via th:replace. That meant the bell rendered and looked
  right, but clicking it did nothing at all — no click handler had
  actually been included on the page. Moving the script inside the
  fragment div (as its last child) fixes this.
-->
<div th:fragment="bell" class="notif-wrap" id="landlordNotifWrap" style="position:relative">
    <style>
        #landlordNotifWrap .landlord-notif-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f2f5f6;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            padding: 0;
        }
        #landlordNotifWrap .landlord-notif-btn:hover {
            background: #e6ecee;
        }
        #landlordNotifWrap .landlord-notif-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #17313A;
            stroke-width: 1.6;
        }
        #landlordNotifWrap .landlord-notif-dot {
            position: absolute;
            top: 6px;
            right: 7px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #2f6fed;
            border: 2px solid #fff;
            display: none;
        }
    </style>

    <button class="landlord-notif-btn" id="landlordNotifBtn" title="Notifications" type="button">
        <svg viewBox="0 0 20 20"><path d="M10 2a6 6 0 00-6 6v3l-1.5 2.5h15L16 11V8a6 6 0 00-6-6zM8 16a2 2 0 004 0"/></svg>
    </button>
    <div class="landlord-notif-dot" id="landlordNotifDot"></div>

    <div id="landlordNotifDropdown" style="display:none;position:absolute;top:calc(100% + 10px);right:0;width:360px;max-height:420px;overflow-y:auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,0.14);z-index:50">

        <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #f0f0f0">
            <strong style="font-size:14px">Notifications</strong>
            <button type="button" id="landlordNotifMarkAll"
                    style="background:none;border:none;color:#2f6fed;font-size:12px;font-weight:600;cursor:pointer;padding:0">
                Mark all as read
            </button>
        </div>

        <div id="landlordNotifList"></div>

        <div id="landlordNotifEmpty" style="display:none;padding:28px 16px;text-align:center;color:#9aa1a9;font-size:13px">
            No notifications yet.
        </div>
    </div>

    <script th:inline="none">
        (function () {
            var btn = document.getElementById('landlordNotifBtn');
            var dot = document.getElementById('landlordNotifDot');
            var dropdown = document.getElementById('landlordNotifDropdown');
            var list = document.getElementById('landlordNotifList');
            var empty = document.getElementById('landlordNotifEmpty');
            var markAllBtn = document.getElementById('landlordNotifMarkAll');

            // Guard against double-wiring if this fragment is ever accidentally
            // included twice on one page.
            if (!btn || btn.dataset.wired === '1') return;
            btn.dataset.wired = '1';

            function escapeHtml(str) {
                var div = document.createElement('div');
                div.textContent = str == null ? '' : str;
                return div.innerHTML;
            }

            function renderNotifications(data) {
                var notifications = data.notifications || [];
                dot.style.display = data.unreadCount > 0 ? 'block' : 'none';

                if (notifications.length === 0) {
                    list.innerHTML = '';
                    empty.style.display = 'block';
                    return;
                }
                empty.style.display = 'none';

                list.innerHTML = notifications.map(function (n) {
                    var unreadStyle = n.isRead ? '' : 'background:#f4faf7;';
                    return '' +
                        '<div class="landlord-notif-row" data-id="' + n.id + '" ' +
                        'style="padding:14px 16px;border-bottom:1px solid #f5f5f5;cursor:pointer;' + unreadStyle + '">' +
                        '  <div style="display:flex;align-items:flex-start;gap:8px">' +
                        '    <div style="flex:1">' +
                        '      <div style="font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:3px">' + escapeHtml(n.title) + '</div>' +
                        '      <div style="font-size:12.5px;color:#555;line-height:1.5;white-space:pre-line">' + escapeHtml(n.message) + '</div>' +
                        '      <div style="font-size:11px;color:#9aa1a9;margin-top:6px">' + escapeHtml(n.createdAt) + '</div>' +
                        '    </div>' +
                        (n.isRead ? '' : '<span style="width:8px;height:8px;border-radius:50%;background:#2f6fed;flex-shrink:0;margin-top:4px"></span>') +
                        '  </div>' +
                        '</div>';
                }).join('');

                Array.prototype.forEach.call(list.querySelectorAll('.landlord-notif-row'), function (row) {
                    row.addEventListener('click', function () {
                        var id = row.getAttribute('data-id');
                        fetch('/landlord/notifications/' + id + '/read', { method: 'POST' })
                            .then(function () { loadNotifications(); });
                    });
                });
            }

            function loadNotifications() {
                fetch('/landlord/notifications')
                    .then(function (res) { return res.ok ? res.json() : { notifications: [], unreadCount: 0 }; })
                    .then(renderNotifications)
                    .catch(function () { /* fail quietly — bell just shows no unread dot */ });
            }

            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                var isOpen = dropdown.style.display === 'block';
                dropdown.style.display = isOpen ? 'none' : 'block';
                if (!isOpen) loadNotifications();
            });

            markAllBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                fetch('/landlord/notifications/read-all', { method: 'POST' })
                    .then(function () { loadNotifications(); });
            });

            document.addEventListener('click', function (e) {
                if (dropdown.style.display === 'block' && !dropdown.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
                    dropdown.style.display = 'none';
                }
            });

            // Poll every 60s so the dot updates even if the landlord never opens the dropdown
            loadNotifications();
            setInterval(loadNotifications, 60000);
        })();
    </script>
</div>

</body>
</html>
