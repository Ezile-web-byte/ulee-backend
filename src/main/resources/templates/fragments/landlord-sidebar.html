<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Shared landlord sidebar.  Save as: templates/fragments/landlord-sidebar.html

  Usage from any landlord template (inside <div class="app-shell">):
    <div th:replace="~{fragments/landlord-sidebar :: sidebar('properties')}"></div>

  `active` is one of:  'properties' | 'applications' | 'reviews'

  FIX: "My Properties" used to point at /manage-properties, which has no
  controller mapping (the real route is /landlord-index). That is what
  broke the trip Applications -> My Properties.

  Applications shows a count badge when the model has a
  `pendingApplicationsCount` attribute > 0 (pending applications that need
  the landlord's decision).

  NEW: Reviews shows a count badge when the model has an
  `unviewedReviewsCount` attribute > 0 (reviews the landlord has not opened
  yet). Both numbers are added to every landlord page by
  PropertyController.addLandlordShellData.

  Collapse/expand behaviour lives in landlord-sidebar-toggle.js.

  NEW: the shared popup (css + js) is loaded from here, so EVERY page that
  uses this sidebar gets the "Log out?" confirmation without each page
  including it. It is safe if a page also includes fragments/modal itself:
  ulee-modal.js ignores a second load.

  CHANGED: Log out now sits at the BOTTOM of the sidebar (with a divider
  above it), at the very bottom (the lighthouse drawing was removed), like the student sidebar.
  The sidebar is a flex column; .sidebar-bottom has margin-top:auto, which
  pushes it down to the bottom. The small <style> block below is all the
  CSS this needs. If you prefer, move it into your landlord sidebar
  stylesheet.
-->
<aside class="sidebar" id="sidebar" th:fragment="sidebar(active)">

    <style>
        /* Sidebar = full-height column: logo, menu, [free space], Log out, drawing */
        aside.sidebar {
            display: flex;
            flex-direction: column;
        }
        aside.sidebar .nav-list { flex: 0 0 auto; }

        /* margin-top:auto pushes Log out to the bottom of the sidebar.
           No border here: your existing stylesheet already draws the one line above Log out. */
        aside.sidebar .sidebar-bottom {
            margin-top: auto;
            padding-bottom: 16px;
        }
        aside.sidebar .sidebar-bottom .nav-logout-form { margin: 0; }
        aside.sidebar .sidebar-bottom .nav-item--logout { width: 100%; }

        /* Log out: red text + icon all the time, and NO red button on hover */
        aside.sidebar .nav-item--logout,
        aside.sidebar .nav-item--logout .nav-icon,
        aside.sidebar .nav-item--logout span {
            color: #ff8a8a !important;
        }
        aside.sidebar .nav-item--logout:hover,
        aside.sidebar .nav-item--logout:focus-visible {
            background: transparent !important;
            box-shadow: none !important;
        }
        aside.sidebar .nav-item--logout:hover,
        aside.sidebar .nav-item--logout:hover .nav-icon,
        aside.sidebar .nav-item--logout:hover span {
            color: #ff5c5c !important;   /* slightly brighter red on hover */
        }

        /* The lighthouse drawing is removed: Log out is the last thing in the sidebar */
        aside.sidebar .sidebar-footer { display: none; }
    </style>

    <div class="logo">
        <div class="logo-mark">
            <div class="logo-icon">
                <svg viewBox="0 0 20 20"><path d="M10 2L3 7v11h14V7L10 2zm0 2.6 5 3.5V16H5V8.1l5-3.5zM8 10h4v6H8z"/></svg>
            </div>
            <div class="logo-text">
                <div class="logo-name">ULEE</div>
                <div class="logo-tag">Student Living. Simplified.</div>
            </div>
        </div>
        <button class="sidebar-toggle" id="sidebar-toggle" type="button" title="Toggle sidebar" aria-label="Toggle sidebar" aria-expanded="true">
            <svg viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
    </div>

    <nav class="nav-list">
        <a th:href="@{/landlord-index}" class="nav-item" th:classappend="${active == 'properties'} ? ' active'">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M4 21V9l8-6 8 6v12h-5v-7h-6v7H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <span>My Properties</span>
        </a>
        <a th:href="@{/manage-applications}" class="nav-item" th:classappend="${active == 'applications'} ? ' active'">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M8 3h8a2 2 0 0 1 2 2v14l-6-3-6 3V5a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <span>Applications</span>
            <span class="nav-badge" th:if="${pendingApplicationsCount != null and pendingApplicationsCount > 0}" th:text="${pendingApplicationsCount}">3</span>
        </a>
        <a th:href="@{/my-property-reviews}" class="nav-item" th:classappend="${active == 'reviews'} ? ' active'">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M12 3.5 14.4 9l6 .6-4.5 4 1.4 5.9L12 16.6 6.7 19.5l1.4-5.9-4.5-4 6-.6L12 3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <span>Reviews</span>
            <span class="nav-badge" th:if="${unviewedReviewsCount != null and unviewedReviewsCount > 0}" th:text="${unviewedReviewsCount}">2</span>
        </a>
    </nav>

    <!-- CHANGED: Log out lives in its own bottom block (divider above it).
         Spring Security expects logout as a POST.
         data-confirm: the shared popup asks "Log out?" before the form is sent. -->
    <div class="sidebar-bottom">
        <form th:action="@{/logout}" method="post" class="nav-logout-form">
            <button type="submit" class="nav-item nav-item--logout"
                    data-confirm
                    data-confirm-title="Log out?"
                    data-confirm-message="You'll need to sign in again to manage your properties."
                    data-confirm-ok="Log out"
                    data-confirm-icon="👋">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 17l5-5-5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Log out</span>
            </button>
        </form>
    </div>


    <!-- Shared popup assets (css + js), so "Log out?" works on every page with this sidebar -->
    <th:block th:replace="~{fragments/modal :: assets}"></th:block>
</aside>

</body>
</html>
