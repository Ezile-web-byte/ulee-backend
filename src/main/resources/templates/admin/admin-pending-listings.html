<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ULEE — Review Properties</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/admin-style.css">
    <link rel="stylesheet" href="/speak-with-ai.css">
    <script src="/speak-with-ai-logic.js" defer></script>
    <script src="/speak-with-ai.js" defer></script>
</head>
<body>
<div class="shell">

    <div th:replace="~{fragments/admin-sidebar :: sidebar('review-properties')}"></div>

    <div class="main">
        <header class="topbar"><div class="topbar-title">Review Properties</div></header>
        <div class="content">
            <div class="section active">

                <div th:if="${actionMessage}" style="background:#e8f5e9;border:1px solid #81c784;border-radius:8px;padding:12px 18px;margin-bottom:16px">
                    <strong style="color:#2e7d32" th:text="${actionMessage}">Success</strong>
                </div>
                <div th:if="${actionError}" style="background:#ffebee;border:1px solid #ef5350;border-radius:8px;padding:12px 18px;margin-bottom:16px">
                    <strong style="color:#c62828" th:text="${actionError}">Error</strong>
                </div>

                <!-- Search + academic year filter. GET so the URL stays
                     bookmarkable/shareable and matches how @RequestParam
                     search/academicYear/page are read on the server.
                     Changing the filter always starts back at page 1. -->
                <form th:action="@{/admin/pending-listings}" method="get"
                      style="display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
                    <input type="hidden" name="page" value="1" />
                    <input type="text" name="search" th:value="${search}"
                           placeholder="Search by title, city, or address"
                           style="flex:1;min-width:220px;padding:8px 12px;border:1px solid #ddd;border-radius:8px" />
                    <select name="academicYear" onchange="this.form.submit()"
                            style="padding:8px 12px;border:1px solid #ddd;border-radius:8px">
                        <option value="">All academic years</option>
                        <option th:each="year : ${academicYearOptions}"
                                th:value="${year}"
                                th:text="${year}"
                                th:selected="${selectedAcademicYear != null and selectedAcademicYear == year}">
                            2026
                        </option>
                    </select>
                    <button type="submit" class="btn btn-view">Filter</button>
                </form>

                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">Pending Listings</span>
                        <span class="panel-sub" th:text="${totalPending} + ' awaiting review'">0 pending</span>
                    </div>
                    <table>
                        <thead>
                        <tr>
                            <th>Property Name</th>
                            <th>Location</th>
                            <th>Landlord</th>
                            <th>Reference</th>
                            <th>Date Submitted</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="row : ${rows}">
                            <td><strong th:text="${row.property.title}">Name</strong></td>
                            <td th:text="${row.property.city}">Location</td>
                            <td>
                                <span th:text="${row.landlordName}">Landlord</span>
                                <span class="badge" th:text="${row.trustLabel}" style="margin-left:6px;font-size:11px">Verified</span>
                            </td>
                            <td th:text="${row.ref}">Ref: NMU 2026-001</td>
                            <td th:text="${row.property.createdAt} ?: 'Date not recorded'">Date</td>
                            <td><span class="badge badge-amber"><span class="badge-dot"></span>Pending</span></td>
                            <td>
                                <div class="btn-group">
                                    <a th:href="@{/admin/listing/{id}(id=${row.property.propertyID},from='pending')}" class="btn btn-view">Review</a>
                                    <form th:action="@{/admin/approve-listing/{id}(id=${row.property.propertyID})}" method="post" style="display:inline">
                                        <button type="submit" class="btn btn-primary" style="background-color:#2e7d32;border-color:#2e7d32;color:#fff">Approve</button>
                                    </form>
                                    <form th:action="@{/admin/reject-listing/{id}(id=${row.property.propertyID})}" method="post" style="display:inline"
                                          onsubmit="return confirm('Reject this listing?');">
                                        <button type="submit" class="btn btn-danger" style="background-color:#c62828;border-color:#c62828;color:#fff">Reject</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <p th:if="${#lists.isEmpty(rows)}" style="padding:22px;color:var(--muted)">No listings awaiting review.</p>

                    <!-- Pagination — mirrors currentPage/totalPages/fromIndex/toIndex
                         already computed server-side in viewPendingListings(). -->
                    <div th:if="${totalPages > 1}"
                         style="display:flex;justify-content:space-between;align-items:center;padding:16px;border-top:1px solid #eee">
                        <span style="color:var(--muted);font-size:13px"
                              th:text="'Showing ' + ${fromIndex} + '–' + ${toIndex} + ' of ' + ${totalPending}">
                            Showing 1–10 of 30
                        </span>
                        <div style="display:flex;gap:6px">
                            <a th:if="${currentPage > 1}"
                               th:href="@{/admin/pending-listings(page=${currentPage - 1}, search=${search}, academicYear=${selectedAcademicYear})}"
                               class="btn btn-view">Prev</a>
                            <span style="padding:8px 12px" th:text="'Page ' + ${currentPage} + ' of ' + ${totalPages}">Page 1 of 3</span>
                            <a th:if="${currentPage < totalPages}"
                               th:href="@{/admin/pending-listings(page=${currentPage + 1}, search=${search}, academicYear=${selectedAcademicYear})}"
                               class="btn btn-view">Next</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/speak-with-ai :: speakWithAiWidget(null, null)}"></div>
</body>
</html>
