<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ULEE — Review Properties</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* Custom confirm dialog (replaces the browser's plain popup) */
        .ulee-confirm-backdrop {
            position: fixed; inset: 0; z-index: 1000;
            display: none; align-items: center; justify-content: center;
            background: rgba(10, 30, 38, 0.45); backdrop-filter: blur(3px); padding: 20px;
        }
        .ulee-confirm-backdrop.open { display: flex; animation: uleeFade .18s ease-out; }
        .ulee-confirm-card {
            width: 100%; max-width: 420px; background: #fff; border-radius: 18px;
            padding: 28px 26px 22px; text-align: center; font-family: inherit;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
            animation: uleePop .22s cubic-bezier(.2, .9, .3, 1.2);
        }
        .ulee-confirm-icon { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; }
        .ulee-confirm-icon svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .ulee-confirm-card h3 { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: #12262d; }
        .ulee-confirm-prop { display: inline-block; margin: 2px 0 10px; padding: 4px 12px; border-radius: 999px; background: #f2f5f6; color: #006078; font-size: 12.5px; font-weight: 600; }
        .ulee-confirm-card p { margin: 0 0 22px; font-size: 13.5px; line-height: 1.6; color: #5b6b71; }
        .ulee-confirm-actions { display: flex; gap: 10px; }
        .ulee-confirm-actions button { flex: 1; padding: 12px 0; border-radius: 10px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; transition: transform .1s ease, filter .15s ease; }
        .ulee-confirm-actions button:hover { filter: brightness(0.96); }
        .ulee-confirm-actions button:active { transform: scale(0.97); }
        #uleeConfirmCancel { background: #fff; border: 1px solid #d9dfe2; color: #444; }
        .ulee-confirm-card.tone-danger .ulee-confirm-icon { background: #fdeceb; color: #c62828; }
        .ulee-confirm-card.tone-danger #uleeConfirmOk { background: #c62828; border: 1px solid #c62828; color: #fff; }
        @keyframes uleeFade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes uleePop { from { opacity: 0; transform: translateY(12px) scale(.94); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body>
<div class="shell">

    <div th:replace="~{fragments/admin-sidebar :: sidebar('review-properties')}"></div>

    <div class="main">
        <header class="topbar">
            <div class="topbar-title">Review Properties</div>
            <div th:replace="~{fragments/notification-bell :: bell}"></div>
        </header>
        <div class="content">
            <div class="section active">

                <div th:if="${actionMessage}" style="background:#e8f5e9;border:1px solid #81c784;border-radius:8px;padding:12px 18px;margin-bottom:16px">
                    <strong style="color:#2e7d32" th:text="${actionMessage}">Success</strong>
                </div>
                <div th:if="${actionError}" style="background:#ffebee;border:1px solid #ef5350;border-radius:8px;padding:12px 18px;margin-bottom:16px">
                    <strong style="color:#c62828" th:text="${actionError}">Error</strong>
                </div>

                <!-- Search + academic year filter. GET so the URL stays
                     bookmarkable/shareable and matches how @RequestParam
                     search/academicYear/page are read on the server.
                     Changing the filter always starts back at page 1.
                     The academicYear <select> is intercepted by JS below so
                     picking a year swaps just the results panel instead of
                     doing a full page navigation; submitting the form itself
                     (via the Filter button, or JS disabled) still works as a
                     normal full-page GET fallback. -->
                <form th:action="@{/admin/pending-listings}" method="get" id="pendingFilterForm"
                      style="display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
                    <input type="hidden" name="page" value="1" />
                    <input type="text" name="search" id="pendingSearchInput" th:value="${search}"
                           placeholder="Search by title, city, or address"
                           style="flex:1;min-width:220px;padding:8px 12px;border:1px solid #ddd;border-radius:8px" />
                    <select name="academicYear" id="academicYearSelect"
                            style="padding:8px 12px;border:1px solid #ddd;border-radius:8px">
                        <option value="">All academic years</option>
                        <option th:each="year : ${academicYearOptions}"
                                th:value="${year}"
                                th:text="${year}"
                                th:selected="${selectedAcademicYear != null and selectedAcademicYear == year}">
                            2026
                        </option>
                    </select>
                    <button type="submit" class="btn" style="background:var(--p);color:#fff;border:1px solid var(--p)">Filter</button>
                </form>

                <div class="panel" id="pendingPanel">
                    <div class="panel-header">
                        <span class="panel-title">Pending Listings</span>
                        <span class="panel-sub" th:text="${totalPending} + ' awaiting review'">0 pending</span>
                    </div>
                    <table>
                        <thead>
                        <tr>
                            <th>Property Name</th>
                            <th>Location</th>
                            <th>Landlord</th>
                            <th>Reference</th>
                            <th>Date Submitted</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="row : ${rows}">
                            <td><strong th:text="${row.property.title}">Name</strong></td>
                            <td th:text="${row.property.city}">Location</td>
                            <td>
                                <span th:text="${row.landlordName}">Landlord</span>
                                <span class="badge" th:text="${row.trustLabel}" style="margin-left:6px;font-size:11px">Verified</span>
                            </td>
                            <td th:text="${row.ref}">Ref: NMU 2026-001</td>
                            <td th:text="${row.property.createdAt} ?: 'Date not recorded'">Date</td>
                            <td><span class="badge badge-amber"><span class="badge-dot"></span>Pending</span></td>
                            <td>
                                <div class="btn-group">
                                    <a th:href="@{/admin/listing/{id}(id=${row.property.propertyID},from='pending')}" class="btn btn-view">Review</a>
                                    <form th:action="@{/admin/approve-listing/{id}(id=${row.property.propertyID})}" method="post" style="display:inline">
                                        <button type="submit" class="btn"
                                                style="background:var(--success-bg);color:var(--success);border:1px solid var(--success-border)">
                                            Approve
                                        </button>
                                    </form>
                                    <form th:action="@{/admin/reject-listing/{id}(id=${row.property.propertyID})}" method="post" style="display:inline"
                                          class="confirm-form" th:attr="data-property=${row.property.title}"
                                          data-title="Reject this listing?"
                                          data-text="It will be marked as Rejected and won't be visible to students."
                                          data-button="Yes, reject">
                                        <button type="submit" class="btn btn-danger">Reject</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <p th:if="${#lists.isEmpty(rows)}" style="padding:22px;color:var(--muted)">No listings awaiting review.</p>

                    <!-- Pagination — mirrors currentPage/totalPages/fromIndex/toIndex
                         already computed server-side in viewPendingListings(). -->
                    <div th:if="${totalPages > 1}"
                         style="display:flex;justify-content:space-between;align-items:center;padding:16px;border-top:1px solid #eee">
                        <span style="color:var(--muted);font-size:13px"
                              th:text="'Showing ' + ${fromIndex} + '–' + ${toIndex} + ' of ' + ${totalPending}">
                            Showing 1–10 of 30
                        </span>
                        <div style="display:flex;gap:6px">
                            <a th:if="${currentPage > 1}"
                               th:href="@{/admin/pending-listings(page=${currentPage - 1}, search=${search}, academicYear=${selectedAcademicYear})}"
                               class="btn btn-view">Prev</a>
                            <span style="padding:8px 12px" th:text="'Page ' + ${currentPage} + ' of ' + ${totalPages}">Page 1 of 3</span>
                            <a th:if="${currentPage < totalPages}"
                               th:href="@{/admin/pending-listings(page=${currentPage + 1}, search=${search}, academicYear=${selectedAcademicYear})}"
                               class="btn btn-view">Next</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/speak-with-ai :: speakWithAiWidget(null, null)}"></div>

<script>
    // Picking an academic year re-fetches /admin/pending-listings with the
    // new filter and swaps ONLY the #pendingPanel content in place, instead
    // of doing a full page navigation. If the selected year has no matches,
    // the server-rendered "No listings awaiting review." message (already
    // in the panel markup above) comes through in the swap, so the empty
    // state shows correctly without a full reload.
    document.addEventListener('DOMContentLoaded', function () {
        var yearSelect = document.getElementById('academicYearSelect');
        var searchInput = document.getElementById('pendingSearchInput');
        var panel = document.getElementById('pendingPanel');
        if (!yearSelect || !panel) return;

        function buildUrl() {
            var params = new URLSearchParams();
            params.set('page', '1');
            if (searchInput && searchInput.value) params.set('search', searchInput.value);
            if (yearSelect.value) params.set('academicYear', yearSelect.value);
            return '/admin/pending-listings?' + params.toString();
        }

        function loadFiltered() {
            var url = buildUrl();
            panel.style.opacity = '0.5';
            fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' }, cache: 'no-store' })
                .then(function (r) { return r.text(); })
                .then(function (html) {
                    var doc = new DOMParser().parseFromString(html, 'text/html');
                    var newPanel = doc.getElementById('pendingPanel');
                    if (newPanel) {
                        newPanel.id = 'pendingPanel';
                        panel.replaceWith(newPanel);
                        panel = newPanel;
                        // Re-run this same listener wiring on the freshly
                        // swapped-in pagination links/panel.
                        attachPaginationInterception();
                    }
                    window.history.replaceState({}, '', url);
                })
                .catch(function () {
                    // Fall back to a normal full navigation if the fetch fails.
                    window.location.href = url;
                })
                .finally(function () {
                    panel.style.opacity = '1';
                });
        }

        function attachPaginationInterception() {
            panel.querySelectorAll('a.btn-view').forEach(function (link) {
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    panel.style.opacity = '0.5';
                    fetch(link.href, { headers: { 'X-Requested-With': 'XMLHttpRequest' }, cache: 'no-store' })
                        .then(function (r) { return r.text(); })
                        .then(function (html) {
                            var doc = new DOMParser().parseFromString(html, 'text/html');
                            var newPanel = doc.getElementById('pendingPanel');
                            if (newPanel) {
                                newPanel.id = 'pendingPanel';
                                panel.replaceWith(newPanel);
                                panel = newPanel;
                                attachPaginationInterception();
                            }
                            window.history.replaceState({}, '', link.href);
                        })
                        .finally(function () { panel.style.opacity = '1'; });
                });
            });
        }

        yearSelect.addEventListener('change', loadFiltered);
        attachPaginationInterception();
    });
</script>
<!-- Custom confirm dialog (used by Reject) -->
<div id="ulee-confirm" class="ulee-confirm-backdrop" aria-hidden="true">
    <div id="uleeConfirmCard" class="ulee-confirm-card tone-danger" role="dialog" aria-modal="true" aria-labelledby="uleeConfirmTitle">
        <div id="uleeConfirmIcon" class="ulee-confirm-icon"></div>
        <h3 id="uleeConfirmTitle">Are you sure?</h3>
        <div id="uleeConfirmProperty" class="ulee-confirm-prop"></div>
        <p id="uleeConfirmText"></p>
        <div class="ulee-confirm-actions">
            <button type="button" id="uleeConfirmCancel">Cancel</button>
            <button type="button" id="uleeConfirmOk">Confirm</button>
        </div>
    </div>
</div>

<script>
    // Nice-looking confirm dialog for forms marked class="confirm-form".
    // Uses one listener on the whole page, so it also works for rows that get
    // swapped in later (e.g. after filtering). Only the confirm button submits.
    (function () {
        var backdrop = document.getElementById('ulee-confirm');
        var card = document.getElementById('uleeConfirmCard');
        var pendingForm = null;
        var REJECT_ICON = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>';

        function openConfirm(form) {
            pendingForm = form;
            card.className = 'ulee-confirm-card tone-danger';
            document.getElementById('uleeConfirmIcon').innerHTML = REJECT_ICON;
            document.getElementById('uleeConfirmTitle').textContent = form.getAttribute('data-title') || 'Are you sure?';
            document.getElementById('uleeConfirmText').textContent = form.getAttribute('data-text') || '';
            document.getElementById('uleeConfirmOk').textContent = form.getAttribute('data-button') || 'Confirm';
            var prop = form.getAttribute('data-property');
            var propEl = document.getElementById('uleeConfirmProperty');
            propEl.textContent = prop || '';
            propEl.style.display = prop ? 'inline-block' : 'none';
            backdrop.classList.add('open');
            backdrop.setAttribute('aria-hidden', 'false');
            document.getElementById('uleeConfirmCancel').focus();
        }

        function closeConfirm() {
            backdrop.classList.remove('open');
            backdrop.setAttribute('aria-hidden', 'true');
            pendingForm = null;
        }

        document.addEventListener('submit', function (e) {
            var form = e.target;
            if (form && form.classList && form.classList.contains('confirm-form')) {
                e.preventDefault();
                openConfirm(form);
            }
        });

        document.getElementById('uleeConfirmCancel').addEventListener('click', closeConfirm);
        document.getElementById('uleeConfirmOk').addEventListener('click', function () {
            var form = pendingForm;
            closeConfirm();
            if (form) form.submit(); // form.submit() skips the submit event, so no loop
        });
        backdrop.addEventListener('click', function (e) { if (e.target === backdrop) closeConfirm(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeConfirm(); });
    })();
</script>
</body>
</html>
