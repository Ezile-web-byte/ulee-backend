<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ULEE — All Listings</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/admin-style.css">
    <script src="/admin-script.js" defer></script>
</head>
<body>
<div class="shell">

    <div th:replace="~{fragments/admin-sidebar :: sidebar('listings')}"></div>

    <div class="main">
        <header class="topbar"><div class="topbar-title">All Listings</div></header>
        <div class="content">
            <div class="section active">

                <div th:if="${actionMessage}" style="background:#e8f5e9;border:1px solid #81c784;border-radius:8px;padding:12px 18px;margin-bottom:16px">
                    <strong style="color:#2e7d32" th:text="${actionMessage}">Success</strong>
                </div>
                <div th:if="${actionError}" style="background:#ffebee;border:1px solid #ef5350;border-radius:8px;padding:12px 18px;margin-bottom:16px">
                    <strong style="color:#c62828" th:text="${actionError}">Error</strong>
                </div>

                <!-- Search by area / property name / address + Status filter -->
                <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap">

                    <div style="max-width:360px;flex:1;min-width:220px;position:relative">
                        <svg viewBox="0 0 20 20" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#9aa1a9;fill:none;stroke-width:1.6">
                            <circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/>
                        </svg>
                        <input type="text" id="listingsSearchInput" th:value="${search}"
                               placeholder="Search by area, address, or property name…"
                               onkeydown="if(event.key==='Enter'){applyListingFilters();}"
                               style="width:100%;padding:9px 12px 9px 34px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;font-size:14px;box-sizing:border-box" />
                    </div>

                    <select id="listingsStatusFilter"
                            onchange="applyListingFilters();"
                            style="padding:9px 32px 9px 12px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;font-size:14px;background:#fff;color:#1a1a1a;cursor:pointer">
                        <option value="" th:selected="${status == null or status == ''}">All statuses</option>
                        <option value="Approved" th:selected="${status == 'Approved'}">Approved</option>
                        <option value="Pending" th:selected="${status == 'Pending'}">Pending</option>
                        <option value="Rejected" th:selected="${status == 'Rejected'}">Rejected</option>
                        <option value="Suspended" th:selected="${status == 'Suspended'}">Suspended</option>
                    </select>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">All Listings</span>
                        <span class="panel-sub" th:text="${#lists.size(properties)} + ' of ' + ${totalListings} + ' total'">0 total</span>
                    </div>
                    <table>
                        <thead>
                        <tr>
                            <th style="width:56px">PHOTO</th>
                            <th>Property Name</th>
                            <th>Location</th>
                            <th>Rent</th>
                            <th>Status</th>
                            <th>Applicants</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="property : ${properties}">
                            <td>
                                <a th:href="@{/admin/listing/{id}(id=${property.propertyID},from='listings')}" style="display:inline-block">
                                    <img th:if="${property.mainImageUrl} != null" th:src="${property.mainImageUrl}"
                                         style="width:40px;height:40px;object-fit:cover;border-radius:8px" />
                                    <span th:if="${property.mainImageUrl} == null"
                                          style="display:inline-block;width:40px;height:40px;background:#eee;border-radius:8px"></span>
                                </a>
                            </td>
                            <td>
                                <a th:href="@{/admin/listing/{id}(id=${property.propertyID},from='listings')}"
                                   th:text="${property.title}"
                                   style="font-weight:600;color:#1a1a1a;text-decoration:none">Name</a>
                            </td>
                            <td th:text="${property.city}">Location</td>
                            <td th:text="'R' + ${property.rent}">Rent</td>
                            <td>
                                <span th:if="${property.status} == 'Approved' or ${property.status} == 'Active'" class="badge badge-green"><span class="badge-dot"></span>Approved</span>
                                <span th:if="${property.status} == 'Pending'" class="badge badge-amber"><span class="badge-dot"></span>Pending</span>
                                <span th:if="${property.status} == 'Rejected'" class="badge badge-red"><span class="badge-dot"></span>Rejected</span>
                                <span th:if="${property.status} == 'Suspended'" class="badge badge-red"><span class="badge-dot"></span>Suspended</span>
                                <span th:if="${property.status} == null" class="badge badge-amber">Unknown</span>
                            </td>
                            <td>
                                <span th:text="${applicationCounts.get(property.propertyID)} ?: 0">0</span>
                                <span style="color:var(--muted)">applied</span>
                            </td>
                            <td>
                                <form th:if="${property.status} == 'Suspended'"
                                      th:action="@{/admin/unsuspend-listing/{id}(id=${property.propertyID})}"
                                      method="post"
                                      onsubmit="return confirm('Unsuspend this listing? It will become visible to students again.');">
                                    <button type="submit"
                                            style="background:#fff;border:1px solid #1a9b5b;color:#1a9b5b;padding:6px 12px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap">
                                        Unsuspend
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <p th:if="${#lists.isEmpty(properties)}" style="padding:22px;color:var(--muted)">No listings found.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    function applyListingFilters() {
        var search = document.getElementById('listingsSearchInput').value;
        var status = document.getElementById('listingsStatusFilter').value;
        var params = new URLSearchParams();
        if (search) params.set('search', search);
        if (status) params.set('status', status);
        var qs = params.toString();
        window.location.href = '/admin/listings' + (qs ? '?' + qs : '');
    }
</script>
</body>
</html>
