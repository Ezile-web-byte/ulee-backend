<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ULEE — All Listings</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/admin-style.css">
    <script src="/admin-script.js" defer></script>
    <style>
        /* Unsuspend button: same amber as the "Suspend Listing" button on the report page */
        .btn-unsuspend {
            background: #fff; border: 1px solid #e5a300; color: #8a5a00;
            padding: 6px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 600;
            font-family: inherit; cursor: pointer; white-space: nowrap;
            transition: background .15s ease;
        }
        .btn-unsuspend:hover { background: #fff8e1; }

        /* Status badges: Suspended = amber like the Suspend/Unsuspend buttons,
           Rejected = red exactly like the Reject button */
        .badge-suspended { background: #fff8e1; color: #8a5a00; border: 1px solid #e5a300; }
        .badge-rejected  { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }

        /* Custom confirm dialog (replaces the browser's plain popup) */
        .ulee-confirm-backdrop {
            position: fixed; inset: 0; z-index: 1000;
            display: none; align-items: center; justify-content: center;
            background: rgba(10, 30, 38, 0.45); backdrop-filter: blur(3px); padding: 20px;
        }
        .ulee-confirm-backdrop.open { display: flex; animation: uleeFade .18s ease-out; }
        .ulee-confirm-card {
            width: 100%; max-width: 420px; background: #fff; border-radius: 18px;
            padding: 28px 26px 22px; text-align: center; font-family: inherit;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
            animation: uleePop .22s cubic-bezier(.2, .9, .3, 1.2);
        }
        .ulee-confirm-icon { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; }
        .ulee-confirm-icon svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .ulee-confirm-card h3 { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: #12262d; }
        .ulee-confirm-prop { display: inline-block; margin: 2px 0 10px; padding: 4px 12px; border-radius: 999px; background: #f2f5f6; color: #006078; font-size: 12.5px; font-weight: 600; }
        .ulee-confirm-card p { margin: 0 0 22px; font-size: 13.5px; line-height: 1.6; color: #5b6b71; }
        .ulee-confirm-actions { display: flex; gap: 10px; }
        .ulee-confirm-actions button { flex: 1; padding: 12px 0; border-radius: 10px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; transition: transform .1s ease, filter .15s ease; }
        .ulee-confirm-actions button:hover { filter: brightness(0.96); }
        .ulee-confirm-actions button:active { transform: scale(0.97); }
        #uleeConfirmCancel { background: #fff; border: 1px solid #d9dfe2; color: #444; }
        .ulee-confirm-card.tone-warning .ulee-confirm-icon { background: #fff4d6; color: #b57a00; }
        .ulee-confirm-card.tone-warning #uleeConfirmOk { background: #FFDC68; border: 1px solid #F8CF4F; color: #4a3500; }
        @keyframes uleeFade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes uleePop { from { opacity: 0; transform: translateY(12px) scale(.94); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body>
<div class="shell">

    <div th:replace="~{fragments/admin-sidebar :: sidebar('listings')}"></div>

    <div class="main">
        <header class="topbar">
            <div class="topbar-title">All Listings</div>
            <div th:replace="~{fragments/notification-bell :: bell}"></div>
            <button type="button" class="logout-btn" onclick="openLogoutModal()">
                <svg viewBox="0 0 20 20">
                    <path d="M7 4H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>
                    <path d="M13 14l4-4-4-4"/>
                    <path d="M17 10H7"/>
                </svg>
                Log out
            </button>
        </header>
        <div class="content">
            <div class="section active">

                <div th:if="${actionMessage}" style="background:#e8f5e9;border:1px solid #81c784;border-radius:8px;padding:12px 18px;margin-bottom:16px">
                    <strong style="color:#2e7d32" th:text="${actionMessage}">Success</strong>
                </div>
                <div th:if="${actionError}" style="background:#ffebee;border:1px solid #ef5350;border-radius:8px;padding:12px 18px;margin-bottom:16px">
                    <strong style="color:#c62828" th:text="${actionError}">Error</strong>
                </div>

                <!-- Search by area / property name / address + Status filter -->
                <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap">

                    <div style="max-width:360px;flex:1;min-width:220px;position:relative">
                        <svg viewBox="0 0 20 20" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#9aa1a9;fill:none;stroke-width:1.6">
                            <circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/>
                        </svg>
                        <input type="text" id="listingsSearchInput" th:value="${search}"
                               placeholder="Search by area, address, or property name…"
                               onkeydown="if(event.key==='Enter'){applyListingFilters();}"
                               style="width:100%;padding:9px 12px 9px 34px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;font-size:14px;box-sizing:border-box" />
                    </div>

                    <select id="listingsStatusFilter"
                            onchange="applyListingFilters();"
                            style="padding:9px 32px 9px 12px;border:1px solid var(--hero-yellow);border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;background:var(--hero-yellow);color:var(--on-yellow);cursor:pointer">
                        <option value="" th:selected="${status == null or status == ''}">All statuses</option>
                        <option value="Approved" th:selected="${status == 'Approved'}">Approved</option>
                        <option value="Pending" th:selected="${status == 'Pending'}">Pending</option>
                        <option value="Rejected" th:selected="${status == 'Rejected'}">Rejected</option>
                        <option value="Suspended" th:selected="${status == 'Suspended'}">Suspended</option>
                    </select>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">All Listings</span>
                        <span class="panel-sub" th:text="${#lists.size(properties)} + ' of ' + ${totalListings} + ' total'">0 total</span>
                    </div>
                    <table>
                        <thead>
                        <tr>
                            <th style="width:56px">PHOTO</th>
                            <th>Property Name</th>
                            <th>Location</th>
                            <th>Rent</th>
                            <th>Status</th>
                            <th>Applicants</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="property : ${properties}">
                            <td>
                                <a th:href="@{/admin/listing/{id}(id=${property.propertyID},from='listings')}" style="display:inline-block">
                                    <img th:if="${property.mainImageUrl} != null" th:src="${property.mainImageUrl}"
                                         style="width:40px;height:40px;object-fit:cover;border-radius:8px" />
                                    <span th:if="${property.mainImageUrl} == null"
                                          style="display:inline-block;width:40px;height:40px;background:#eee;border-radius:8px"></span>
                                </a>
                            </td>
                            <td>
                                <a th:href="@{/admin/listing/{id}(id=${property.propertyID},from='listings')}"
                                   th:text="${property.title}"
                                   style="font-weight:600;color:#1a1a1a;text-decoration:none">Name</a>
                            </td>
                            <td th:text="${property.city}">Location</td>
                            <td th:text="'R' + ${property.rent}">Rent</td>
                            <td>
                                <span th:if="${property.status} == 'Approved' or ${property.status} == 'Active'" class="badge badge-green"><span class="badge-dot"></span>Approved</span>
                                <span th:if="${property.status} == 'Pending'" class="badge badge-amber"><span class="badge-dot"></span>Pending</span>
                                <span th:if="${property.status} == 'Rejected'" class="badge badge-rejected"><span class="badge-dot"></span>Rejected</span>
                                <span th:if="${property.status} == 'Suspended'" class="badge badge-suspended"><span class="badge-dot"></span>Suspended</span>
                                <span th:if="${property.status} == null" class="badge badge-amber">Unknown</span>
                            </td>
                            <td>
                                <span th:text="${applicationCounts.get(property.propertyID)} ?: 0">0</span>
                                <span style="color:var(--muted)">applied</span>
                            </td>
                            <td>
                                <form th:if="${property.status} == 'Suspended'"
                                      th:action="@{/admin/unsuspend-listing/{id}(id=${property.propertyID})}"
                                      method="post"
                                      class="confirm-form" th:attr="data-property=${property.title}"
                                      data-tone="warning" data-icon="eye" data-title="Unsuspend this listing?"
                                      data-text="It will become visible to students again straight away."
                                      data-button="Yes, unsuspend">
                                    <button type="submit" class="btn-unsuspend">
                                        Unsuspend
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <p th:if="${#lists.isEmpty(properties)}" style="padding:22px;color:var(--muted)">No listings found.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Logout confirmation modal — matches the confirm dialog used elsewhere
     in the admin app ("Log out of ULEE?"). The visible "Log out" button in
     the topbar just opens this; the real POST to /logout only happens when
     the admin confirms inside the modal. -->
<div id="logoutModalOverlay" style="display:none;position:fixed;inset:0;background:rgba(23,49,58,0.45);z-index:1000;align-items:center;justify-content:center">
    <div style="background:var(--white);border-radius:16px;box-shadow:var(--shadow-md);padding:32px 28px 24px;width:340px;max-width:90vw;text-align:center">
        <div style="width:52px;height:52px;border-radius:50%;background:var(--danger-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
            <svg viewBox="0 0 20 20" style="width:22px;height:22px;stroke:var(--danger);fill:none;stroke-width:1.8">
                <path d="M7 4H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>
                <path d="M13 14l4-4-4-4"/>
                <path d="M17 10H7"/>
            </svg>
        </div>
        <div style="font-size:17px;font-weight:700;color:var(--text);margin-bottom:8px">Log out of ULEE?</div>
        <div style="font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:22px">You'll need to sign in again to access the admin dashboard.</div>
        <div style="display:flex;gap:10px">
            <button type="button" onclick="closeLogoutModal()"
                    style="flex:1;padding:11px;border-radius:10px;border:none;background:var(--pp);color:var(--text);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">
                Cancel
            </button>
            <button type="button" onclick="document.getElementById('logoutForm').submit()"
                    style="flex:1;padding:11px;border-radius:10px;border:none;background:var(--danger);color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">
                Log out
            </button>
        </div>
    </div>
</div>
<form id="logoutForm" th:action="@{/logout}" method="post" style="display:none"></form>

<script th:inline="javascript">
    function applyListingFilters() {
        var search = document.getElementById('listingsSearchInput').value;
        var status = document.getElementById('listingsStatusFilter').value;
        var params = new URLSearchParams();
        if (search) params.set('search', search);
        if (status) params.set('status', status);
        var qs = params.toString();
        window.location.href = '/admin/listings' + (qs ? '?' + qs : '');
    }

    function openLogoutModal() {
        document.getElementById('logoutModalOverlay').style.display = 'flex';
    }
    function closeLogoutModal() {
        document.getElementById('logoutModalOverlay').style.display = 'none';
    }
    document.addEventListener('DOMContentLoaded', function () {
        var overlay = document.getElementById('logoutModalOverlay');
        overlay.addEventListener('click', function (e) {
            if (e.target === overlay) closeLogoutModal();
        });
    });
</script>
<!-- Custom confirm dialog (used by Unsuspend) -->
<div id="ulee-confirm" class="ulee-confirm-backdrop" aria-hidden="true">
    <div id="uleeConfirmCard" class="ulee-confirm-card tone-warning" role="dialog" aria-modal="true" aria-labelledby="uleeConfirmTitle">
        <div id="uleeConfirmIcon" class="ulee-confirm-icon"></div>
        <h3 id="uleeConfirmTitle">Are you sure?</h3>
        <div id="uleeConfirmProperty" class="ulee-confirm-prop"></div>
        <p id="uleeConfirmText"></p>
        <div class="ulee-confirm-actions">
            <button type="button" id="uleeConfirmCancel">Cancel</button>
            <button type="button" id="uleeConfirmOk">Confirm</button>
        </div>
    </div>
</div>

<script>
    // Nice-looking confirm dialog for forms marked class="confirm-form".
    // Clicking the form's button opens the dialog; only the confirm button submits.
    (function () {
        var backdrop = document.getElementById('ulee-confirm');
        var card = document.getElementById('uleeConfirmCard');
        var pendingForm = null;

        var ICONS = {
            eye: '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
            warning: '<svg viewBox="0 0 24 24"><path d="M12 3l9.5 16.5h-19L12 3z"/><path d="M12 10v4.5M12 17.5v.01"/></svg>'
        };

        function openConfirm(form) {
            var tone = form.getAttribute('data-tone') || 'warning';
            var icon = form.getAttribute('data-icon') || tone;
            pendingForm = form;
            card.className = 'ulee-confirm-card tone-' + tone;
            document.getElementById('uleeConfirmIcon').innerHTML = ICONS[icon] || ICONS.warning;
            document.getElementById('uleeConfirmTitle').textContent = form.getAttribute('data-title') || 'Are you sure?';
            document.getElementById('uleeConfirmText').textContent = form.getAttribute('data-text') || '';
            document.getElementById('uleeConfirmOk').textContent = form.getAttribute('data-button') || 'Confirm';
            var prop = form.getAttribute('data-property');
            var propEl = document.getElementById('uleeConfirmProperty');
            propEl.textContent = prop || '';
            propEl.style.display = prop ? 'inline-block' : 'none';
            backdrop.classList.add('open');
            backdrop.setAttribute('aria-hidden', 'false');
            document.getElementById('uleeConfirmCancel').focus();
        }

        function closeConfirm() {
            backdrop.classList.remove('open');
            backdrop.setAttribute('aria-hidden', 'true');
            pendingForm = null;
        }

        document.querySelectorAll('form.confirm-form').forEach(function (form) {
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                openConfirm(form);
            });
        });

        document.getElementById('uleeConfirmCancel').addEventListener('click', closeConfirm);
        document.getElementById('uleeConfirmOk').addEventListener('click', function () {
            var form = pendingForm;
            closeConfirm();
            if (form) form.submit(); // form.submit() skips the submit event, so no loop
        });
        backdrop.addEventListener('click', function (e) { if (e.target === backdrop) closeConfirm(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeConfirm(); });
    })();
</script>
</body>
</html>
