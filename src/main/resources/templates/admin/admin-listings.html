<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ULEE — All Listings</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/admin-style.css">
    <script src="/admin-script.js" defer></script>
</head>
<body>
<div class="shell">

    <div th:replace="~{fragments/admin-sidebar :: sidebar('listings')}"></div>

    <div class="main">
        <header class="topbar"><div class="topbar-title">All Listings</div></header>
        <div class="content">
            <div class="section active">

                <div th:if="${actionMessage}" style="background:#e8f5e9;border:1px solid #81c784;border-radius:8px;padding:12px 18px;margin-bottom:16px">
                    <strong style="color:#2e7d32" th:text="${actionMessage}">Success</strong>
                </div>
                <div th:if="${actionError}" style="background:#ffebee;border:1px solid #ef5350;border-radius:8px;padding:12px 18px;margin-bottom:16px">
                    <strong style="color:#c62828" th:text="${actionError}">Error</strong>
                </div>

                <!-- Search by area / property name / address -->
                <div style="margin-bottom:16px;max-width:360px;position:relative">
                    <svg viewBox="0 0 20 20" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#9aa1a9;fill:none;stroke-width:1.6">
                        <circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/>
                    </svg>
                    <input type="text" id="listingsSearchInput" th:value="${search}"
                           placeholder="Search by area, address, or property name…"
                           onkeydown="if(event.key==='Enter'){window.location.href='/admin/listings?search='+encodeURIComponent(this.value);}"
                           style="width:100%;padding:9px 12px 9px 34px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;font-size:14px" />
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">All Listings</span>
                        <span class="panel-sub" th:text="${#lists.size(properties)} + ' of ' + ${totalListings} + ' total'">0 total</span>
                    </div>
                    <table>
                        <thead>
                        <tr>
                            <th style="width:56px">PHOTO</th>
                            <th>Property Name</th>
                            <th>Location</th>
                            <th>Rent</th>
                            <th>Status</th>
                            <th>Applicants</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="property : ${properties}">
                            <td>
                                <a th:href="@{/admin/listing/{id}(id=${property.propertyID})}" style="display:inline-block">
                                    <img th:if="${property.mainImageUrl} != null" th:src="${property.mainImageUrl}"
                                         style="width:40px;height:40px;object-fit:cover;border-radius:8px" />
                                    <span th:if="${property.mainImageUrl} == null"
                                          style="display:inline-block;width:40px;height:40px;background:#eee;border-radius:8px"></span>
                                </a>
                            </td>
                            <td>
                                <a th:href="@{/admin/listing/{id}(id=${property.propertyID})}"
                                   th:text="${property.title}"
                                   style="font-weight:600;color:#1a1a1a;text-decoration:none">Name</a>
                            </td>
                            <td th:text="${property.city}">Location</td>
                            <td th:text="'R' + ${property.rent}">Rent</td>
                            <td>
                                <span th:if="${property.status} == 'Approved' or ${property.status} == 'Active'" class="badge badge-green"><span class="badge-dot"></span>Approved</span>
                                <span th:if="${property.status} == 'Pending'" class="badge badge-amber"><span class="badge-dot"></span>Pending</span>
                                <span th:if="${property.status} == 'Rejected'" class="badge badge-red"><span class="badge-dot"></span>Rejected</span>
                                <span th:if="${property.status} == null" class="badge badge-amber">Unknown</span>
                            </td>
                            <td>
                                <span th:text="${applicationCounts.get(property.propertyID)} ?: 0">0</span>
                                <span style="color:var(--muted)">applied</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <p th:if="${#lists.isEmpty(properties)}" style="padding:22px;color:var(--muted)">No listings found.</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
