<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ULEE — Reported Listings</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/admin-style.css">
    <link rel="stylesheet" href="/speak-with-ai.css">
    <script src="/speak-with-ai-logic.js" defer></script>
    <script src="/speak-with-ai.js" defer></script>
</head>
<body>
<div class="shell">

    <div th:replace="~{fragments/admin-sidebar :: sidebar('reported')}"></div>

    <div class="main">
        <header class="topbar">
            <div class="topbar-title">Reported Listings</div>
            <div th:replace="~{fragments/notification-bell :: bell}"></div>
            <!--
              FIX: this page had no Log out button at all. The admin-sidebar
              fragment above already defines confirmAdminLogout() (opens the
              same styled "Log out of ULEE?" confirmation used elsewhere and
              submits the real /logout form on confirm), so this just wires
              a button to it — same pattern as the other admin pages.
            -->
            <button class="logout-btn" onclick="confirmAdminLogout()">
                <svg viewBox="0 0 20 20"><path d="M13 3h4v14h-4M9 14l4-4-4-4M13 10H5"/></svg>
                <span>Log out</span>
            </button>
        </header>
        <div class="content">
            <div class="section active">
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">Reported Listings</span>
                        <span class="panel-sub" th:text="${#lists.size(reportedProperties)} + ' flagged'">0 flagged</span>
                    </div>
                    <table>
                        <thead><tr><th>Property</th><th>Reason</th><th>Actions</th></tr></thead>
                        <tbody>
                        <tr th:each="property : ${reportedProperties}">
                            <td th:text="${property.title}">Name</td>
                            <td th:text="${property.reportReason} ?: 'No reason provided'">Reason</td>
                            <td><a th:href="@{/admin/reported-listing/{id}(id=${property.propertyID})}" class="btn btn-view">Handle</a></td>
                        </tr>
                        </tbody>
                    </table>
                    <p th:if="${#lists.isEmpty(reportedProperties)}" style="padding:22px;color:var(--muted)">No reported listings.</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
