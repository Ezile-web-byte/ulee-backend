<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ULEE — Handle Reported Property</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin-style.css">
  <link rel="stylesheet" href="/speak-with-ai.css">
  <script src="/speak-with-ai-logic.js" defer></script>
  <script src="/speak-with-ai.js" defer></script>
</head>
<body>
<div class="shell">

  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-mark">
        <div class="logo-icon">
          <svg viewBox="0 0 20 20"><path d="M10 2L3 7v11h14V7L10 2zm0 2.6 5 3.5V16H5V8.1l5-3.5zM8 10h4v6H8z"/></svg>
        </div>
        <div class="logo-text">
          <div class="logo-name">ULEE</div>
          <div class="logo-tag">The future of Student Living</div>
        </div>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-label">Main</div>

      <div class="nav-item" data-section="dashboard" data-label="Dashboard" onclick="window.location.href='/admin-index'">
        <svg class="nav-icon" viewBox="0 0 20 20"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5"/></svg>
        <span class="nav-item-label">Dashboard</span>
      </div>

      <div class="nav-item" data-section="listings" data-label="Listings" onclick="window.location.href='/admin/listings'">
        <svg class="nav-icon" viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h10"/></svg>
        <span class="nav-item-label">Listings</span>
      </div>

      <div class="nav-item" data-section="users" data-label="Users" onclick="window.location.href='/admin/manage-users'">
        <svg class="nav-icon" viewBox="0 0 20 20"><circle cx="8" cy="7" r="3"/><path d="M2 17c0-3.3 2.7-6 6-6"/><circle cx="15" cy="9" r="2.5"/><path d="M11 17c0-2.2 1.8-4 4-4s4 1.8 4 4"/></svg>
        <span class="nav-item-label">Users</span>
      </div>

      <div class="nav-label">Moderation</div>

      <div class="nav-item" data-section="reviews" data-label="Reviews" onclick="window.location.href='/admin/reviews'">
        <svg class="nav-icon" viewBox="0 0 20 20"><path d="M10 2l2.3 4.7 5.2.8-3.8 3.7.9 5.2L10 14l-4.6 2.4.9-5.2L2.5 7.5l5.2-.8z"/></svg>
        <span class="nav-item-label">Reviews</span>
      </div>

      <div class="nav-item active" data-section="reported" data-label="Reported" onclick="window.location.href='/admin/reported-listings'">
        <svg class="nav-icon" viewBox="0 0 20 20"><path d="M10 3l7 14H3L10 3z"/><path d="M10 9v4M10 15h.01"/></svg>
        <span class="nav-item-label">Reported</span>
      </div>

      <div class="nav-label">System</div>

      <div class="nav-item" data-section="settings" data-label="Settings">
        <svg class="nav-icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2M5.1 5.1l1.4 1.4M13.5 13.5l1.4 1.4M5.1 14.9l1.4-1.4M13.5 6.5l1.4-1.4"/></svg>
        <span class="nav-item-label">Settings</span>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="admin-chip">
        <div class="avatar">SA</div>
        <div class="admin-info">
          <div class="admin-name">Sarah Admin</div>
          <div class="admin-role">Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar"><div class="topbar-title">Handle Reported Property</div></header>
    <div class="content">
      <div class="section active">

        <div th:if="${actionMessage}" style="background:#e8f5e9;border:1px solid #81c784;border-radius:8px;padding:12px 18px;margin-bottom:16px">
          <strong style="color:#2e7d32" th:text="${actionMessage}">Success</strong>
        </div>
        <div th:if="${actionError}" style="background:#ffebee;border:1px solid #ef5350;border-radius:8px;padding:12px 18px;margin-bottom:16px">
          <strong style="color:#c62828" th:text="${actionError}">Error</strong>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div>
              <span class="panel-title" th:text="${property.title}">Property Name</span>
              <span class="panel-sub" th:text="${property.address} + ', ' + ${property.city}">Address</span>
            </div>
            <span class="badge badge-red"><span class="badge-dot"></span>Reported</span>
          </div>

          <div style="padding:22px">
            <div class="field-group">
              <label class="field-label">Landlord</label>
              <p th:if="${landlord != null}" th:text="${landlord.firstName} + ' ' + ${landlord.lastName} + ' (' + ${landlord.email} + ')'">Landlord</p>
              <p th:if="${landlord == null}" style="color:var(--muted)">Landlord record not found.</p>
            </div>

            <div class="field-group">
              <label class="field-label">Report Reason</label>
              <p th:text="${property.reportReason} ?: 'No reason provided'">Reason</p>
            </div>

            <div style="display:flex;gap:10px;margin-top:20px">
              <form th:action="@{/admin/warn-landlord-for-listing/{id}(id=${property.propertyID})}" method="post">
                <button type="submit" class="btn btn-primary" style="padding:9px 22px;border-radius:8px">Send Official Warning</button>
              </form>
              <form th:action="@{/admin/remove-listing/{id}(id=${property.propertyID})}" method="post"
                    onsubmit="return confirm('Permanently remove this listing? This cannot be undone.');">
                <button type="submit" class="btn btn-danger" style="padding:9px 22px;border-radius:8px">Remove Listing</button>
              </form>
              <a href="/admin/reported-listings" class="btn btn-view" style="padding:9px 22px;border-radius:8px;text-decoration:none">Back</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/speak-with-ai :: speakWithAiWidget(null, null)}"></div>
</body>
</html>
