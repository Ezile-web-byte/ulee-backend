<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ULEE — Reviews</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin-style.css">
  <script src="/admin-script.js" defer></script>
  <link rel="stylesheet" href="/speak-with-ai.css">
  <script src="/speak-with-ai-logic.js" defer></script>
  <script src="/speak-with-ai.js" defer></script>
</head>
<body>

<div class="shell">

  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-mark">
        <div class="logo-icon">
          <svg viewBox="0 0 20 20"><path d="M10 2L3 7v11h14V7L10 2zm0 2.6 5 3.5V16H5V8.1l5-3.5zM8 10h4v6H8z"/></svg>
        </div>
        <div class="logo-text">
          <div class="logo-name">ULEE</div>
          <div class="logo-tag">The future of Student Living</div>
        </div>
      </div>
      <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar">
        <svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6"/></svg>
      </button>
    </div>

    <nav class="nav">
      <div class="nav-label">Main</div>

      <div class="nav-item" data-section="dashboard" data-label="Dashboard" onclick="window.location.href='/admin-index'">
        <svg class="nav-icon" viewBox="0 0 20 20"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5"/></svg>
        <span class="nav-item-label">Dashboard</span>
      </div>

      <div class="nav-item" data-section="listings" data-label="Listings" onclick="window.location.href='/admin/listings'">
        <svg class="nav-icon" viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h10"/></svg>
        <span class="nav-item-label">Listings</span>
      </div>

      <div class="nav-item" data-section="users" data-label="Users" onclick="window.location.href='/admin/manage-users'">
        <svg class="nav-icon" viewBox="0 0 20 20"><circle cx="8" cy="7" r="3"/><path d="M2 17c0-3.3 2.7-6 6-6"/><circle cx="15" cy="9" r="2.5"/><path d="M11 17c0-2.2 1.8-4 4-4s4 1.8 4 4"/></svg>
        <span class="nav-item-label">Users</span>
      </div>

      <div class="nav-label">Moderation</div>

      <div class="nav-item active" data-section="reviews" data-label="Reviews">
        <svg class="nav-icon" viewBox="0 0 20 20"><path d="M10 2l2.3 4.7 5.2.8-3.8 3.7.9 5.2L10 14l-4.6 2.4.9-5.2L2.5 7.5l5.2-.8z"/></svg>
        <span class="nav-item-label">Reviews</span>
        <span class="nav-badge" th:text="${totalReviews}">0</span>
      </div>

      <div class="nav-item" data-section="reported" data-label="Reported" onclick="window.location.href='/admin/reported-listings'">
        <svg class="nav-icon" viewBox="0 0 20 20"><path d="M10 3l7 14H3L10 3z"/><path d="M10 9v4M10 15h.01"/></svg>
        <span class="nav-item-label">Reported</span>
      </div>

      <div class="nav-label">System</div>

      <div class="nav-item" data-section="settings" data-label="Settings">
        <svg class="nav-icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2M5.1 5.1l1.4 1.4M13.5 13.5l1.4 1.4M5.1 14.9l1.4-1.4M13.5 6.5l1.4-1.4"/></svg>
        <span class="nav-item-label">Settings</span>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="admin-chip">
        <div class="avatar">SA</div>
        <div class="admin-info">
          <div class="admin-name">Sarah Admin</div>
          <div class="admin-role">Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">

    <header class="topbar">
      <div class="topbar-title" id="topbar-title">Reviews <span>— Moderation</span></div>
      <div class="notif-wrap">
        <button class="icon-btn" title="Notifications">
          <svg viewBox="0 0 20 20"><path d="M10 2a6 6 0 00-6 6v3l-1.5 2.5h15L16 11V8a6 6 0 00-6-6zM8 16a2 2 0 004 0"/></svg>
        </button>
      </div>
      <button class="logout-btn" onclick="alert('Logging out…')">
        <svg viewBox="0 0 20 20"><path d="M13 3h4v14h-4M9 14l4-4-4-4M13 10H5"/></svg>
        <span>Log out</span>
      </button>
    </header>

    <div class="content">

      <div class="panel">
        <div class="panel-header">
          <div>
            <span class="panel-title">All Reviews</span>
            <span class="panel-sub" th:text="${totalReviews} + ' reviews'">0 reviews</span>
          </div>
        </div>
        <table>
          <thead>
          <tr>
            <th>PROPERTY</th>
            <th>RATING</th>
            <th>COMMENT</th>
            <th>DATE</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="review : ${reviews}">
            <td th:text="${propertyLookup.get(review.propertyID) != null
                                        ? propertyLookup.get(review.propertyID).title
                                        : ('Property #' + review.propertyID)}">Property Name</td>
            <td th:text="${review.rating}">5</td>
            <td th:text="${review.comment}">Comment text</td>
            <td th:text="${review.reviewDate}">Date</td>
          </tr>
          </tbody>
        </table>
        <p th:if="${#lists.isEmpty(reviews)}" style="padding:22px;color:var(--muted)">
          No reviews yet.
        </p>
      </div>

    </div>
  </div>
</div>

<div th:replace="~{fragments/speak-with-ai :: speakWithAiWidget(null, null)}"></div>
</body>
</html>
